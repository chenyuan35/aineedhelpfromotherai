name: Bootstrap H2O PayGo evidence maintenance
on:
  push:
    branches:
      - phone/h2o-paygo-evidence-20261005
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phone/h2o-paygo-evidence-20261005
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply canonical maintenance
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          route_id="h2o-paygo-10-90d-2026"
          new_sources=[
           {"id":"prepaidcompare-h2o-paygo-wifi-20261005","url":"https://prepaidcompare.net/profiles/h2o-wireless.html","type":"independent-editorial","reportedAt":"2026-10-05"},
           {"id":"reddit-h2o-paygo-wifi-abroad-20240618","url":"https://www.reddit.com/r/NoContract/comments/1diwx9b","type":"independent-community","reportedAt":"2024-06-18"},
           {"id":"weiming-h2o-paygo-wifi-reset-20261005","url":"https://sites.google.com/view/weimingminxingqiu/2026%E5%B9%B4%E8%83%BD%E5%9C%A8%E4%B8%AD%E5%9B%BD%E6%BC%AB%E6%B8%B8%E7%9A%84%E7%BE%8E%E5%9B%BD%E5%AE%9E%E4%BD%93%E7%94%B5%E8%AF%9D%E5%8D%A1%E5%AE%8C%E6%95%B4%E7%9B%98%E7%82%B9","type":"independent-editorial","reportedAt":"2026-10-05"},
          ]
          def load(p): return json.loads(Path(p).read_text())
          def dump(p,d): Path(p).write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n")
          sources=load("data/phone/v1/sources.json")
          existing={x["id"] for x in sources}
          for source in new_sources:
              if source["id"] not in existing: sources.append(source)
          dump("data/phone/v1/sources.json",sources)
          routes=load("data/phone/v1/routes.json")
          route=next(x for x in routes if x["id"]==route_id)
          route["lastVerifiedAt"]="2026-10-05"
          for source in new_sources:
              if source["id"] not in route["sourceIds"]: route["sourceIds"].append(source["id"])
          dump("data/phone/v1/routes.json",routes)
          events=load("data/phone/v1/events.json")
          event_id="evt-h2o-paygo-wifi-continuity-conflict-20261005"
          if not any(x["id"]==event_id for x in events):
              events.append({"id":event_id,"routeId":route_id,"type":"overseas-wifi-calling-evidence-conflict","reportedAt":"2026-10-05","scope":"route","outcome":"H2O PayGo overseas continuity remains conflicted. A 2024 community recommendation reports PayGo Wi-Fi Calling and activation outside the United States, while the current PrepaidCompare profile says Wi-Fi Calling is monthly-plan only and a 2026 China-use guide reports recurring support resets may be needed. Current H2O terms still frame service as personal use in the U.S. only. Preserve HOLD and do not claim stable overseas SMS/OTP continuity.","sourceId":"weiming-h2o-paygo-wifi-reset-20261005"})
          dump("data/phone/v1/events.json",events)
          snaps=load("data/phone/v1/snapshots.json")
          old=next(x for x in reversed(snaps) if x["routeId"]==route_id and x["kind"]=="current-profile")
          data=json.loads(json.dumps(old["data"]))
          data.update({
            "wifiCalling":"Conflicted for PayGo. A June 2024 community recommendation reports PayGo Wi-Fi Calling and activation outside the U.S.; the current PrepaidCompare profile says Wi-Fi Calling is supported on monthly plans only, not PayGo; and a 2026 China-use guide reports PayGo Wi-Fi Calling may stop working until support resets it. Do not rely on PayGo Wi-Fi Calling as stable overseas continuity.",
            "chinaActivation":"Outside-U.S. activation has historical community support, but current H2O terms state H2O service is for personal use in the U.S. only. China-first activation is therefore not treated as a current guaranteed path.",
            "holdReason":"Current H2O terms do not establish PayGo as an overseas continuity product, and independent evidence conflicts on PayGo Wi-Fi Calling: historical success reports coexist with current plan-profile exclusion and 2026 recurring-reset reports. International roaming remains unavailable for PayGo. Keep HOLD until current PayGo-specific continuity is independently reproduced with stable SMS behavior.",
            "lastVerifiedAt":"2026-10-05",
            "sourceIds":list(dict.fromkeys(data.get("sourceIds",[])+[source["id"] for source in new_sources])),
            "guideSteps":["Treat this as a low-cost U.S. PayGo observation, not a recommended overseas retention route.","Do not assume international roaming: current H2O terms do not make PayGo an eligible roaming path.","Do not rely on Wi-Fi Calling abroad without a current PayGo-specific reproduction; independent sources conflict and a 2026 guide reports recurring support resets.","Re-open the HOLD only after current PayGo-specific overseas SMS continuity is reproduced independently."]
          })
          new_snap={"id":"snap-h2o-paygo-10-90d-2026-current-profile-20261005","routeId":route_id,"kind":"current-profile","checkedAt":"2026-10-05","sourceDataset":"h2o-paygo-wifi-continuity-maintenance-2026-10-05","data":data}
          if not any(x["id"]==new_snap["id"] for x in snaps): snaps.append(new_snap)
          dump("data/phone/v1/snapshots.json",snaps)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path("PROJECT_CONTEXT.md"); s=p.read_text()
          s=s.replace("Last updated: 2026-10-04","Last updated: 2026-10-05",1)
          s=s.replace("Canonical is now 159 routes / 87 markets / 156 brands / 117 networks / 625 sources, covering","Canonical is now 159 routes / 87 markets / 156 brands / 117 networks / 633 sources, covering",1)
          s=s.replace("- Phone normalized canonical: **159 routes / 87 markets / 156 brands / 117 networks / 625 sources**.","- Phone normalized canonical: **159 routes / 87 markets / 156 brands / 117 networks / 633 sources**.")
          s=s.replace("Current state is 159 routes / 87 markets / 156 brands / 117 networks / 625 sources; the final known Macau residual","Current state is 159 routes / 87 markets / 156 brands / 117 networks / 633 sources; the final known Macau residual",1)
          anchor="## Latest release checkpoint — ClubSIM Telegram evidence density\n"
          insert="""## Latest maintenance checkpoint — Ultra + H2O evidence density\n\nPR #394 (`459be509372d214a8f8cb4143eafa1be49664f37`) applied the reviewed Ultra Mobile PayGo Telegram packet to canonical data. Ultra now has **5 exact Telegram registration-verification observations from 5 distinct sources: 3 success / 0 failure / 2 mixed / observed success 60.0% / grade C**. It remains `admitted` + `backstage-only`; publication did not expand.\n\nThe 2026-10-05 H2O PayGo maintenance adds three independent route-level sources to the existing `h2o-paygo-10-90d-2026` record and reconciles a material overseas-continuity conflict: a 2024 community report says PayGo Wi-Fi Calling/activation abroad worked, while the current PrepaidCompare profile says Wi-Fi Calling is monthly-plan only and a 2026 China-use guide reports recurring support resets. Current H2O terms still frame service as personal use in the U.S. only. H2O therefore remains `hold` + `backstage-only`; no app/service percentage is created because no exact app sample meets the evidence threshold. The source corpus is now **633**; canonical/publication counts remain **159 routes / 87 markets / 156 brands / 117 networks**, **135 comparison / 3 indexable / 31 sitemap URLs**.\n\n"""
          if insert not in s: s=s.replace(anchor,insert+anchor,1)
          s=s.replace("7. **PARALLEL — community/provider evidence maintenance.** PR #390 added seven deduplicated ClubSIM Telegram registration observations from seven distinct dated community source records, producing a bounded 28.6% observed-success aggregate (2 success / 3 failure / 2 mixed, grade C) while keeping the route backstage-only. Continue the same evidence-density work on another high-value low-cost existing route; no new DB batch without a genuinely distinct evidence-qualified route trigger.","7. **PARALLEL — community/provider evidence maintenance.** PR #390 matured ClubSIM Telegram evidence; PR #394 matured Ultra Mobile PayGo Telegram evidence to n=5 / 60.0% observed success / grade C; the 2026-10-05 H2O PayGo pass reconciles conflicting overseas Wi-Fi Calling evidence without manufacturing app observations and keeps H2O HOLD. Continue one-route-at-a-time maintenance; no new DB batch without a genuinely distinct evidence-qualified route trigger.")
          p.write_text(s)
          p=Path("docs/MASTER_PLAN.md"); s=p.read_text()
          s=s.replace("Last updated: 2026-10-04","Last updated: 2026-10-05",1)
          s=s.replace("now place canonical v1 at **159 routes / 87 markets / 156 brands / 117 networks / 625 sources**","now place canonical v1 at **159 routes / 87 markets / 156 brands / 117 networks / 633 sources**",1)
          s=s.replace("leave canonical at **159 routes / 87 markets / 156 brands / 117 networks / 625 sources**","leave canonical at **159 routes / 87 markets / 156 brands / 117 networks / 633 sources**",1)
          s=s.replace("5. **PARALLEL — evidence-density maintenance.** PR #390 matured ClubSIM Telegram registration to a threshold-qualified but weak/mixed aggregate: **7 deduplicated observations / 7 distinct sources / 2 success / 3 failure / 2 mixed / 28.6% observed success / grade C**. ClubSIM remains backstage-only; the next maintenance pass should apply the same exact route+service+operation discipline to another high-value low-cost existing route. Continue separate Data-eSIM intake; re-open a DB batch only for a genuinely new evidence-qualified atomic route.","5. **PARALLEL — evidence-density maintenance.** PR #390 matured ClubSIM Telegram registration to **n=7 / 28.6% observed success / grade C**; PR #394 matured Ultra Mobile PayGo Telegram registration to **n=5 / 60.0% observed success / grade C**. The 2026-10-05 H2O PayGo pass adds three independent route-level continuity sources and preserves HOLD because current Wi-Fi Calling evidence conflicts; it creates no app percentage without exact app observations. Continue one-route-at-a-time evidence maintenance and separate Data-eSIM intake; re-open a DB batch only for a genuinely new evidence-qualified atomic route.")
          p.write_text(s)
          p=Path("docs/CURRENT_EXECUTION_QUEUE.md"); s=p.read_text()
          s=s.replace("Last updated: 2026-10-04","Last updated: 2026-10-05",1)
          s=s.replace("159 canonical routes / 87 markets / 156 brands / 117 networks / 625 sources","159 canonical routes / 87 markets / 156 brands / 117 networks / 633 sources",1)
          start=s.index("## JUST COMPLETED — Ultra Mobile PayGo Telegram evidence packet")
          end=s.index("## External waits")
          new="""## JUST COMPLETED — Ultra Mobile PayGo Telegram canonical application\n\nPR #394 squash-merged as `459be509372d214a8f8cb4143eafa1be49664f37`.\n\n- Applied the five reviewed exact-route + Telegram + registration-verification sources to canonical data.\n- Aggregate is **3 success / 0 failure / 2 mixed / n=5 / 5 distinct sources / observed success 60.0% / grade C (Mixed / weak)**.\n- `ultra-mobile-paygo-3-2026` remains `admitted` + `backstage-only`; no route URL, indexability rule or sitemap entry was added.\n- Source corpus became **630**. Canonical remained **159 routes / 87 markets / 156 brands / 117 networks**; public boundary remained **135 comparison / 3 indexable / 31 sitemap URLs**.\n- Eval Gate #1168 and CI #256: **PASS**; Vercel Preview and production: **PASS**.\n\n## JUST COMPLETED — H2O PayGo overseas-continuity evidence maintenance\n\n- Existing route: `h2o-paygo-10-90d-2026`, real-mobile AT&T-route PayGo at **US$10 / 90 days**, already `backstage-only` / `hold`.\n- Added three independent route-level sources: current PrepaidCompare plan profile, a June 2024 community PayGo/Wi-Fi-Calling report, and a 2026 China-use guide.\n- Evidence is materially conflicting: historical community evidence reports PayGo Wi-Fi Calling and activation outside the U.S.; current PrepaidCompare says Wi-Fi Calling is monthly-plan only; the 2026 China-use guide reports recurring support resets. Current H2O terms continue to frame service as personal use in the U.S. only and PayGo is not treated as an international-roaming route.\n- Preserve `hold` + `backstage-only`. Do **not** create an app/service percentage: the reviewed packet contains route-level continuity evidence, not five exact app + operation observations.\n- Source corpus becomes **633**. Canonical remains **159 routes / 87 markets / 156 brands / 117 networks**; public boundary remains **135 comparison / 3 indexable / 31 sitemap URLs**.\n\n## NEXT — Measurement + one-route evidence maintenance, no invented expansion\n\n1. **Search Console gate:** publication remains held until settled Phone impressions reach 20 or finalized data reaches 2026-10-05. Re-read when the gate is actually available; do not expand publication before then.\n2. **Next database task:** review one existing low-cost/high-value route with thin service evidence. Start with `tello-paygo-credit-2026` as the next bounded candidate because it is real-mobile, admitted/backstage-only, has six current route sources but zero normalized service observations. Require exact route + app/service + operation evidence; if the evidence is only route-level, record it as route/event maintenance rather than manufacturing a service percentage.\n3. **Database expansion:** no currently known evidence-qualified atomic residual remains outside canonical; reopen only for a genuinely new evidence-qualified route.\n4. **Data-eSIM:** continue append-only community intake separately; do not mix pure data eSIM into Phone-number canonical without reviewed identity linkage.\n5. **Frontend:** keep PR #342 visual baseline and PR #370 finder path stable; no new URL or redesign without measured/reproduced need.\n\nDelegated Qwen/Kimi output remains `RESEARCH_CANDIDATE` until coordinator review and cannot bypass evidence/admission/publication gates.\n\n"""
          s=s[:start]+new+s[end:]
          p.write_text(s)
          PY
          cat > scripts/test-phone-h2o-paygo-maintenance.mjs <<'EOF'
          import fs from "node:fs";
          import assert from "node:assert/strict";
          const read = p => JSON.parse(fs.readFileSync(p, "utf8"));
          const routes = read("data/phone/v1/routes.json");
          const sources = read("data/phone/v1/sources.json");
          const observations = read("data/phone/v1/observations.json");
          const events = read("data/phone/v1/events.json");
          const detail = read("frontend/tools/phone-number-lifecycle-mvp/phone-route-data/h2o-paygo-10-90d-2026.json");
          const summary = read("frontend/tools/phone-number-lifecycle-mvp/phone-route-summaries.json").routes.find(x => x.id === "h2o-paygo-10-90d-2026");
          const route = routes.find(x => x.id === "h2o-paygo-10-90d-2026");
          assert(route);
          assert.equal(route.surfaceState, "backstage-only");
          assert.equal(route.evidenceState, "hold");
          assert.equal(route.lastVerifiedAt, "2026-10-05");
          const ids = ["prepaidcompare-h2o-paygo-wifi-20261005","reddit-h2o-paygo-wifi-abroad-20240618","weiming-h2o-paygo-wifi-reset-20261005"];
          for (const id of ids) { assert(route.sourceIds.includes(id)); assert(sources.some(x => x.id === id)); }
          assert(events.some(x => x.id === "evt-h2o-paygo-wifi-continuity-conflict-20261005"));
          assert.equal(observations.filter(x => x.routeId === route.id).length, 0);
          assert.equal(detail.serviceEvidence.length, 0);
          assert(summary);
          assert.equal(summary.serviceEvidence.length, 0);
          assert.equal(summary.decisionFacts.sourceCount, 6);
          const latest = detail.snapshots.at(-1);
          assert.equal(latest.id, "snap-h2o-paygo-10-90d-2026-current-profile-20261005");
          assert.match(latest.data.wifiCalling, /Conflicted for PayGo/);
          assert.match(latest.data.holdReason, /Keep HOLD/);
          console.log("H2O PayGo evidence maintenance OK");
          EOF
          python3 - <<'PY'
          import json
          p="package.json"
          d=json.load(open(p))
          s=d["scripts"]["phone:data:check"]
          needle=" && node scripts/test-phone-ultramobile-telegram-maintenance.mjs"
          if "test-phone-h2o-paygo-maintenance.mjs" not in s:
              d["scripts"]["phone:data:check"]=s.replace(needle,needle+" && node scripts/test-phone-h2o-paygo-maintenance.mjs")
          open(p,"w").write(json.dumps(d,indent=2)+"\n")
          PY
          node scripts/build-phone-database.mjs
      - name: Validate
        shell: bash
        run: |
          npm ci --ignore-scripts
          npm run phone:data:check
          npm ci --prefix frontend
          npm run build --prefix frontend
          node scripts/test-phone-number-public-release.mjs
          git diff --check
      - name: Commit final branch state
        shell: bash
        run: |
          rm -f .github/workflows/bootstrap-h2o.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "data(phone): reconcile H2O PayGo overseas continuity"
          git push origin HEAD:phone/h2o-paygo-evidence-20261005
