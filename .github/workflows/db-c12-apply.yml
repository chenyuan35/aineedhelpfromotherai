name: DB-C12 branch patch apply

on:
  push:
    branches:
      - phone/db-c12-coverage-20261001

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phone/db-c12-coverage-20261001
          fetch-depth: 0
      - name: Apply validated DB-C12 patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .db-c12.patch.gz.b64 | gzip -d > /tmp/db-c12.patch
          git apply --check /tmp/db-c12.patch
          git apply /tmp/db-c12.patch
          rm .db-c12.patch.gz.b64 .github/workflows/db-c12-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize Phone DB-C12 routes"
          git push origin HEAD:phone/db-c12-coverage-20261001
