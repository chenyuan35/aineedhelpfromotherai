name: Bootstrap 1pMobile maintenance

on:
  push:
    branches:
      - phone/1pmobile-payg-maintenance-20261006

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .bootstrap/1pmobile-20261006.patch.gz.b64 | gunzip > /tmp/1pmobile.patch
          git apply --check /tmp/1pmobile.patch
          git apply /tmp/1pmobile.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "data(phone): reconcile 1pMobile PAYG lifecycle"
      - name: Install root dependencies
        run: npm ci
      - name: Phone data checks
        run: npm run phone:data:check
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend
      - name: Public release audit
        run: node scripts/test-phone-number-public-release.mjs
      - name: Diff hygiene
        run: git diff --check
      - name: Remove bootstrap artifacts and push
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git rm .bootstrap/1pmobile-20261006.patch.gz.b64 .github/workflows/bootstrap-1pmobile-20261006.yml
          git commit -m "chore: remove 1pMobile bootstrap artifacts"
          git push origin HEAD:${GITHUB_REF_NAME}
