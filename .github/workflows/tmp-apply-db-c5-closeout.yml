name: Temp apply DB-C5 release closeout

on:
  push:
    branches:
      - docs/db-c5-release-closeout-20260930
    paths:
      - .github/workflows/tmp-apply-db-c5-closeout.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified closeout patch and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .tmp/db-c5-closeout.patch.gz.b64 | gzip -d > /tmp/db-c5-closeout.patch
          git apply --index /tmp/db-c5-closeout.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .tmp/db-c5-closeout.patch.gz.b64 .github/workflows/tmp-apply-db-c5-closeout.yml
          git commit -m "Docs: close DB-C5 release facts"
          git push origin HEAD:${GITHUB_REF_NAME}
