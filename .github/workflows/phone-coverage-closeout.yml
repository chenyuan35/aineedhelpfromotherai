name: Phone coverage closeout

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/PHONE_DATABASE_COVERAGE_AUDIT_2026-10-03.md'
      - 'docs/CURRENT_EXECUTION_QUEUE.md'
      - '.github/workflows/phone-coverage-closeout.yml'

permissions:
  contents: write

jobs:
  closeout:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Update canonical project facts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          context = Path('PROJECT_CONTEXT.md')
          text = context.read_text()
          lines = text.splitlines()
          out = []
          for line in lines:
              if line.startswith('| Phone data / publication foundation |'):
                  line = '| Phone data / publication foundation | **DB-C23 RELEASED / 90%+ COVERAGE OBJECTIVE MET.** DB-C21 through DB-C23 extended the canonical backend to 156 routes / 86 markets / 153 brands / 116 networks / 593 sources. PR #368 (`2d0d727af1f18844b6c344a9402d62de5366dd61`) added eSIM.GG +372 and HK Mobi 365-day as backstage-only routes after DB-C22 added CMLink UK, DITO Philippines and AIS local as HOLD. `docs/PHONE_DATABASE_COVERAGE_AUDIT_2026-10-03.md` reconstructs the known evidence-qualified universe at 159 distinct atomic routes, so current backend coverage is 98.1%. Public state remains 135 comparison routes / 3 indexable routes / 31 sitemap URLs. | Stop broad DB enumeration. Next audit whether all canonical data flows into the user-queryable frontend without making backstage rows indexable or recommendation-ranked. |'
              elif line.startswith('2. **Backend evidence/database coverage:**'):
                  line = '2. **Backend evidence/database coverage:** broad expansion is complete at 156 canonical routes and an audited 98.1% of the known evidence-qualified relevant route universe. Switch to maintenance plus a backend↔frontend integration audit; open another DB batch only on genuinely new evidence-qualified routes or cleared residual blockers.'
              elif line.startswith('- Phone normalized canonical:'):
                  line = '- Phone normalized canonical: **156 routes / 86 markets / 153 brands / 116 networks / 593 sources**.'
              out.append(line)
          text = '\n'.join(out) + '\n'

          replacement = '''14. **DONE — DB-C21.** PR #366 normalized Fortress haha SIM as ADMIT-BACKSTAGE and csl 7-Eleven / Tune Talk 365 as HOLD. Post-release state: 151 routes / 86 markets / 148 brands / 114 networks / 574 sources; publication unchanged.
15. **DONE — DB-C22.** PR #367 (`a7feae58c048afc59af37a086292989cdd47e8fe`) normalized CMLink UK, DITO Philippines and AIS local prepaid as HOLD. Post-release state: 154 routes / 86 markets / 151 brands / 115 networks / 587 sources; CI #234, Eval Gate #1088 and Vercel passed.
16. **DONE — DB-C23.** PR #368 (`2d0d727af1f18844b6c344a9402d62de5366dd61`) normalized eSIM.GG +372 and HK Mobi 365-day as ADMIT-BACKSTAGE. Current state: 156 routes / 86 markets / 153 brands / 116 networks / 593 sources; CI #237, Eval Gate #1092 and Vercel production passed.
17. **DONE — Phone database 90%+ coverage audit.** `docs/PHONE_DATABASE_COVERAGE_AUDIT_2026-10-03.md` defines the evidence-qualified denominator and records 156 / 159 = 98.1% current coverage. This is not a claim about every carrier/SIM SKU worldwide. Broad enumeration stops; residual candidates are LuckySIM HK, Saily U.S. phone number and China Telecom Macau / Macau blue-card.
18. **NEXT — backend↔frontend integration audit.** Verify whether all 156 canonical routes are available to the user-triggered finder/search path without manual frontend duplication. Preserve the 3-route SEO allowlist; distinguish not-indexable from not-user-queryable and never turn HOLD into a confident recommendation.
19. **PARALLEL — community evidence maintenance.** Continue append-only Phone and Data-eSIM evidence intake; no new DB batch without a distinct evidence-qualified route trigger.
20. **WAIT — Search Console publication decision.** Re-read at 20 settled Phone impressions or finalized data through 2026-10-05. TikTok Direct Post remains a separate review wait.'''
          text, n = re.subn(r'14\. \*\*PARALLEL — community Data-eSIM evidence intake\.\*\*.*?(?=\n## Durable source pointers)', replacement + '\n', text, flags=re.S)
          if n != 1:
              raise SystemExit(f'expected one execution-sequence replacement, got {n}')
          if '- Phone coverage closeout:' not in text:
              text = text.replace('- Database coverage execution: `docs/PHONE_DATABASE_COVERAGE_EXECUTION_2026-09-29.md`', '- Database coverage execution: `docs/PHONE_DATABASE_COVERAGE_EXECUTION_2026-09-29.md`\n- Phone coverage closeout: `docs/PHONE_DATABASE_COVERAGE_AUDIT_2026-10-03.md`')
          context.write_text(text)

          coverage = Path('docs/PHONE_DATABASE_COVERAGE_EXECUTION_2026-09-29.md')
          ctext = coverage.read_text()
          marker = '## DB-C21–DB-C23 — coverage closeout 2026-10-03'
          if marker not in ctext:
              ctext += f'''\n\n{marker}\n\nDB-C21 through DB-C23 completed the broad backend expansion phase.\n\n- DB-C21 / PR #366: Fortress haha SIM ADMIT-BACKSTAGE; csl 7-Eleven and Tune Talk 365 HOLD.\n- DB-C22 / PR #367 (`a7feae58c048afc59af37a086292989cdd47e8fe`): CMLink UK, DITO Philippines and AIS local prepaid HOLD.\n- DB-C23 / PR #368 (`2d0d727af1f18844b6c344a9402d62de5366dd61`): eSIM.GG +372 and HK Mobi 365-day ADMIT-BACKSTAGE.\n- Current canonical: **156 routes / 86 markets / 153 brands / 116 networks / 593 sources**.\n- Public boundary remains **135 comparison routes / 3 explicit indexable routes / 31 sitemap URLs**.\n\nThe denominator and stop condition are now explicit in `docs/PHONE_DATABASE_COVERAGE_AUDIT_2026-10-03.md`: **156 / 159 = 98.1%** of the known evidence-qualified relevant low-cost/long-term atomic Phone route universe. This is not a worldwide carrier/SKU census. Broad provider enumeration stops here; future DB batches require genuinely new evidence-qualified routes or cleared residual blockers.\n'''
              coverage.write_text(ctext)
          PY
      - name: Commit fact-source closeout
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_CONTEXT.md docs/PHONE_DATABASE_COVERAGE_EXECUTION_2026-09-29.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs: close Phone database coverage expansion'
          git push origin HEAD:${{ github.head_ref }}
