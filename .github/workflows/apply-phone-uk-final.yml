name: Apply final UK Phone pilot patch

on:
  push:
    branches:
      - phone-uk-pilot-source-packet-20260923

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[phone-final-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply validated patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/phone-final.patch.gz.b64 | gzip -d > /tmp/phone-final.patch
          git apply --check /tmp/phone-final.patch
          git apply /tmp/phone-final.patch
          node scripts/test-phone-number-lifecycle-mvp.mjs
          node frontend/bin/build.mjs
          git diff --check
          rm .github/phone-final.patch.gz.b64 .github/workflows/apply-phone-uk-final.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Implement UK Phone directory matrix [phone-final-applied]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
