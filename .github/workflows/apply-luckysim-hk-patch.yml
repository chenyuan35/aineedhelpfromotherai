name: Apply LuckySIM Hong Kong patch

on:
  push:
    branches:
      - data/luckysim-hk-20261004
    paths:
      - .github/workflows/apply-luckysim-hk-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified local patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 -c 'from pathlib import Path; import hashlib; p=Path(".github/tmp/luckysim-hk-20261004.patch.gz.b64"); d=bytearray(p.read_bytes()); assert len(d)==29208; assert d[4300]==ord("k"); d[4300]=ord("h"); digest=hashlib.sha256(d).hexdigest(); assert digest=="716b98928db234947144e2d2cfbf2e0c4209f57b52f083362b4df17157f538aa", digest; Path("/tmp/luckysim-hk.patch.gz.b64").write_bytes(d)'
          base64 -d /tmp/luckysim-hk.patch.gz.b64 | gzip -d > /tmp/luckysim-hk.patch
          git am /tmp/luckysim-hk.patch
          git rm .github/tmp/luckysim-hk-20261004.patch.gz.b64 .github/tmp/luckysim-hk-20261004.b64.part.00 .github/workflows/apply-luckysim-hk-patch.yml
          git commit -m "chore: remove temporary LuckySIM patch transport"
          git push origin HEAD:${GITHUB_REF_NAME}
