name: tmp-phone-finder-materialize
on:
  push:
    branches: [feat/phone-canonical-finder-20261003]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phone-canonical-finder-20261003
          fetch-depth: 0
      - name: Apply verified local patch once
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "phone-route-summaries.json" frontend/tools/phone-number-lifecycle-mvp/index.html && grep -q "from 'jsdom'" scripts/test-phone-number-public-release.mjs; then
            echo "Patch already materialized"
            exit 0
          fi
          cat > /tmp/phonefinder.patch.gz.b64 <<'EOF'

EOF
          base64 -d /tmp/phonefinder.patch.gz.b64 | gzip -d > /tmp/phonefinder.patch
          git apply --check /tmp/phonefinder.patch
          git apply /tmp/phonefinder.patch
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/tools/phone-number-lifecycle-mvp/index.html scripts/test-phone-number-public-release.mjs
          git commit -m "feat: connect canonical Phone database to finder"
          git push origin HEAD:feat/phone-canonical-finder-20261003
