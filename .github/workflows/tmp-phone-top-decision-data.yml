name: Temporary Phone Top Decision Data Apply

on:
  push:
    branches:
      - feat/phone-top-decision-data-20261004

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Apply bounded Phone decision layer
        run: python3 .github/tmp/apply_phone_top_decision_data.py
      - name: Build Phone derived data
        run: npm run phone:data:build
      - name: Verify Phone data
        run: npm run phone:data:check
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Verify public Phone release
        run: node scripts/test-phone-number-public-release.mjs
      - name: Verify diff formatting
        run: git diff --check
      - name: Remove temporary apply files
        run: rm .github/tmp/apply_phone_top_decision_data.py .github/workflows/tmp-phone-top-decision-data.yml
      - name: Commit generated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(phone): add evidence-gated Top decision layer"
          git push origin HEAD:feat/phone-top-decision-data-20261004
