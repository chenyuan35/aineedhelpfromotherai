name: DB-C2 fact-source sync

on:
  push:
    branches:
      - docs/db-c2-postmerge-facts-20260929

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update canonical project facts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('PROJECT_CONTEXT.md')
          s = p.read_text()
          s, n1 = re.subn(
              r'^\| Phone Radar \|.*$',
              '| Phone Radar | **ACTIVE PRIMARY GROWTH PRODUCT / GLOBAL FINDER RELEASED.** PR #291 (`3b0ec6e03c078bd0121b378b4d535aa2adda81ff`) shipped the 135-route global progressive finder. DB-C2 then expanded only the backstage normalized database; the public comparison surface remains 135 routes and route indexability remains 3. | Keep the released frontend stable while backend evidence/database coverage continues independently; publication still requires a separate gate. |',
              s,
              count=1,
              flags=re.M,
          )
          s, n2 = re.subn(
              r'^\| Phone data / publication foundation \|.*$',
              '| Phone data / publication foundation | **135-ROUTE COMPARISON / 77-ROUTE CANONICAL / 3 INDEXABLE.** After DB-C2 PR #303 (`11177dd8d1e316e0069dcc5f78203d4af7da60dd`), canonical `data/phone/v1` is 77 routes / 47 markets / 74 brands / 59 networks / 264 sources; 66 route IDs overlap the 135-route comparison set and 69 remain legacy-only. Publication remains a separate layer. | Continue DB-C3 from the reviewed legacy-only set; preserve the 3-route indexability allowlist and do not equate database admission with SEO publication. |',
              s,
              count=1,
              flags=re.M,
          )
          marker = 'Search measurement remains important after the corrected surface stabilizes, but tiny samples do not justify recreating programmatic URL families. Evidence acquisition continues independently of public-page count.'
          addition = 'DB-C1 and DB-C2 then resumed backend coverage as a separate track rather than another publication wave. DB-C2 PR #303 (`11177dd8d1e316e0069dcc5f78203d4af7da60dd`) normalized 12 additional legacy-only routes through reviewed packets and raised canonical coverage to 77 routes / 47 markets / 74 brands / 59 networks / 264 sources, with 66 comparison↔canonical route-ID overlaps and 69 comparison routes still legacy-only. Eval Gate #945 and Vercel Preview/production passed; `scripts/test-phone-publication-state.mjs` still reports 135 comparison routes / 3 explicit indexable routes. The next backend batch is DB-C3; no public URL expansion is authorized by that queue.'
          if addition not in s:
              if marker not in s:
                  raise SystemExit('PROJECT_CONTEXT search marker missing')
              s = s.replace(marker, addition + '\n\n' + marker, 1)
          s, n3 = re.subn(
              r'^\*\*Next independent session:.*$',
              '**Next independent session: backend database coverage DB-C3.** Continue from the reviewed 69 legacy-only comparison routes in `docs/CURRENT_EXECUTION_QUEUE.md`; keep this as backstage normalization/evidence work. Any indexability change still requires the full SEO publication gate and a separate reviewed decision.',
              s,
              count=1,
              flags=re.M,
          )
          if (n1, n2, n3) != (1, 1, 1):
              raise SystemExit(f'PROJECT_CONTEXT replacement counts: {(n1, n2, n3)}')
          p.write_text(s)

          p = Path('docs/MASTER_PLAN.md')
          s = p.read_text()
          old_para_re = re.compile(r'^The UK matrix was the first public baseline,.*?authoritative during staged migration\.$', re.M)
          new_para = 'The UK matrix was the first public baseline, and backstage evidence acquisition continues independently of Search Console. After the global data expansion, PR #261 separates broad database coverage from public/indexable page coverage so the database can grow without recreating programmatic SEO families. PR #263 separately makes legacy comparison-database admission explicit: wildcard batch discovery is gone, existing admitted legacy batches are named in a reviewed manifest, and unlisted delegated research stays outside comparison inputs. The Sep 28 compatibility audit found canonical v1 at 15 routes with only four route-ID overlaps; staged reviewed migrations plus backend coverage batches DB-C1 and DB-C2 have since raised canonical v1 to 77 routes / 47 markets / 74 brands / 59 networks / 264 sources with 66 route-ID overlaps. Sixty-nine comparison routes remain legacy-only; the 135-route comparison surface and 3-route explicit publication boundary remain unchanged.'
          s, n4 = old_para_re.subn(new_para, s, count=1)
          block_re = re.compile(r'^38\. \*\*NEXT SESSION — post-A–K Phone checkpoint / bounded next-value selection\.\*\*.*\n39\. \*\*BACKLOG / separate review — second observer/source-change role\.\*\*.*\n40\. \*\*ONGOING — Relay data accrual\.\*\*.*\n41\. \*\*WAIT — TikTok review and authority batch 2\.\*\*.*$', re.M)
          new_block = '\n'.join([
              '38. **DONE — post-A–K Phone checkpoint + bounded public move.** PR #291 shipped the existing Phone hub as a progressive global finder over the admitted 135-route comparison layer while preserving only 3 explicit indexable routes. Search Console remained too small to justify route-page expansion, so backend coverage and public publication were explicitly separated.',
              '39. **DONE — backend database coverage DB-C1.** Twelve legacy-only candidates were independently dispositioned and normalized through reviewed packets, raising canonical coverage to 65 routes / 42 markets / 230 sources while keeping the 135-route comparison surface and 3-route publication boundary unchanged.',
              '40. **DONE — backend database coverage DB-C2 / PR #303.** Twelve more legacy-only routes were researched, sample-audited and normalized; canonical coverage is now 77 routes / 47 markets / 74 brands / 59 networks / 264 sources, with 66 comparison↔canonical route-ID overlaps and 69 comparison routes still legacy-only. PR #303 squash-merged as `11177dd8d1e316e0069dcc5f78203d4af7da60dd`; Eval Gate #945 and Vercel Preview/production passed, and publication remains 135 comparison routes / 3 explicit indexable routes.',
              '41. **ACTIVE — backend database coverage DB-C3.** Continue the next reviewed low-cost/mechanically distinct legacy-only batch from `docs/CURRENT_EXECUTION_QUEUE.md`; preserve provenance, uncertainty and the independent publication gate.',
              '42. **BACKLOG / separate review — second observer/source-change role.** `codex-vps` already has a Relay-history role; do not repurpose it merely to satisfy a two-host topology. The existing trial host already runs the reviewed phone-source timer, so a second machine needs a concrete reliability/value reason before assignment.',
              '43. **ONGOING — Relay data accrual.** No search-led expansion without evidence.',
              '44. **WAIT — TikTok review and authority batch 2.** Do not disturb external waits before their triggers.',
          ])
          s, n5 = block_re.subn(new_block, s, count=1)
          if (n4, n5) != (1, 1):
              raise SystemExit(f'MASTER_PLAN replacement counts: {(n4, n5)}')
          p.write_text(s)
          PY
          git diff --check
      - name: Commit fact-source sync
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/db-c2-facts-bootstrap.yml
          git add PROJECT_CONTEXT.md docs/MASTER_PLAN.md
          git commit -m 'docs: sync DB-C2 post-merge facts'
          git push origin HEAD:${GITHUB_REF_NAME}
