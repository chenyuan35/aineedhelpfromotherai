name: DB-C19 closeout materialize

on:
  push:
    branches: ["docs/db-c19-closeout-20261003"]
    paths:
      - ".github/workflows/db-c19-closeout-materialize.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/db-c19-closeout-20261003
          fetch-depth: 0
      - name: Apply exact reviewed DB-C19 closeout patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .tmp/db-c19-closeout.patch.gz.b64 | gzip -d > /tmp/db-c19-closeout.patch
          echo "fb4c77e18fc5ddf36329c277f54c7c89861584529f50c436acbc60a79cfe5123  /tmp/db-c19-closeout.patch" | sha256sum -c -
          git apply --check /tmp/db-c19-closeout.patch
          git apply /tmp/db-c19-closeout.patch
          git diff --check
      - name: Commit closeout state and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .tmp/db-c19-closeout.patch.gz.b64 .github/workflows/db-c19-closeout-materialize.yml
          rmdir .tmp 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: close out DB-C19 and set coverage-gap audit"
          git push origin HEAD:docs/db-c19-closeout-20261003
