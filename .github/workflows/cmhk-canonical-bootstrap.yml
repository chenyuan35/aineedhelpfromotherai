name: CMHK canonical bootstrap

on:
  push:
    branches:
      - feat/phone-canonical-pilot-cmhk-20260928

permissions:
  contents: write

jobs:
  apply-tested-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified local patch
        shell: bash
        run: |
          cat > /tmp/cmhk.patch.gz.b64 <<'PATCH'
          
          PATCH
          tr -d '[:space:]' < /tmp/cmhk.patch.gz.b64 | base64 -d | gzip -d > /tmp/cmhk.patch
          echo 'b99440f9c16488ee28f99aba9557499ea3a268d24a608f177eee0f258e6cc473  /tmp/cmhk.patch' | sha256sum -c -
          git apply --check /tmp/cmhk.patch
          git apply /tmp/cmhk.patch
          npm run phone:data:check
      - name: Commit exact pilot tree
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/cmhk-canonical-bootstrap.yml
          git add -A
          git commit -m 'feat(phone): pilot legacy route canonical migration'
          git push origin HEAD:feat/phone-canonical-pilot-cmhk-20260928
