name: Bootstrap Tello PAYG evidence maintenance
on:
  push:
    branches:
      - phone/tello-evidence-20261005
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phone/tello-evidence-20261005
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply Tello maintenance
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          route_id="tello-paygo-credit-2026"
          new_sources=[
            {"id":"official-tello-payg-current-20261005","url":"https://tello.com/help_center/new-to-tello/how-does-pay-as-you-go-work","type":"provider-official","reportedAt":"2026-10-05"},
            {"id":"official-tello-payg-sms-topup-20261005","url":"https://tello.com/help_center/can-i-top-up-my-pay-as-you-go-balance-via-sms","type":"provider-official","reportedAt":"2026-10-05"},
            {"id":"official-tello-activation-us-required-20261005","url":"https://tello.com/help_center/activate-port-in/can-i-activate-tello-while-i-m-abroad","type":"provider-official","reportedAt":"2026-10-05"},
            {"id":"official-tello-roaming-us-first-20261005","url":"https://tello.com/help_center/international-roaming/how-can-i-activate-my-international-roaming-service","type":"provider-official","reportedAt":"2026-10-05"},
            {"id":"linuxdo-tello-codex-sms-failure-20260612","url":"https://linux.do/t/topic/717137?page=3","type":"first-hand-community-thread","reportedAt":"2026-06-12"},
            {"id":"reddit-tello-sms-cut-abroad-20260925","url":"https://www.reddit.com/r/Tello/comments/1wq7lir/tello_abruptly_cut_sms2fa_for_me/","type":"independent-community","reportedAt":"2026-09-25"},
            {"id":"reddit-tello-signup-security-20260702","url":"https://www.reddit.com/r/Tello/comments/1ulbqqn/a_quick_clarification_about_our_signup/","type":"provider-moderated-community","reportedAt":"2026-07-02"},
            {"id":"nodeseek-tello-payg-guide-20260928","url":"https://www.nodeseek.com/post-953129-1","type":"independent-community","reportedAt":"2026-09-28"},
          ]
          def load(p): return json.loads(Path(p).read_text())
          def dump(p,d): Path(p).write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n")
          sources=load("data/phone/v1/sources.json"); ids={x["id"] for x in sources}
          for s in new_sources:
              if s["id"] not in ids: sources.append(s)
          dump("data/phone/v1/sources.json",sources)
          routes=load("data/phone/v1/routes.json"); r=next(x for x in routes if x["id"]==route_id)
          r["lastVerifiedAt"]="2026-10-05"
          for s in new_sources:
              if s["id"] not in r["sourceIds"]: r["sourceIds"].append(s["id"])
          dump("data/phone/v1/routes.json",routes)
          events=load("data/phone/v1/events.json")
          new_events=[
            {"id":"evt-tello-payg-current-rules-20261005","routeId":route_id,"type":"payg-lifecycle-and-activation-reconciliation","reportedAt":"2026-10-05","scope":"route","outcome":"Current first-party help confirms PAYG-only remains available, web/manual credit starts at $20, SMS top-ups can add $10 with a saved card, standalone PAYG expires 90 days after purchase, and first activation must occur on a U.S. network tower. International roaming also requires prior U.S. line use.","sourceId":"official-tello-payg-current-20261005"},
            {"id":"evt-tello-overseas-sms-risk-20261005","routeId":route_id,"type":"overseas-sms-and-verification-risk","reportedAt":"2026-10-05","scope":"route","outcome":"2026 community evidence is mixed for overseas SMS continuity: one Tello tutorial thread reports Codex verification SMS not arriving, while a separate long-running overseas user reports SMS/2FA abruptly stopping after months of Wi-Fi Calling. These reports do not isolate PAYG-only plan state tightly enough for a service aggregate, so preserve them as route-level risk evidence rather than manufacturing an app success rate.","sourceId":"reddit-tello-sms-cut-abroad-20260925"},
            {"id":"evt-tello-account-security-risk-20261005","routeId":route_id,"type":"account-security-and-number-continuity-risk","reportedAt":"2026-10-05","scope":"route","outcome":"Tello publicly acknowledges automated and human fraud-prevention checks can decline orders; community replies in the same provider-moderated thread describe account suspensions and concern about preserving long-held numbers. This is a continuity risk signal, not a quantified suspension probability.","sourceId":"reddit-tello-signup-security-20260702"}
          ]
          have={x["id"] for x in events}
          for e in new_events:
              if e["id"] not in have: events.append(e)
          dump("data/phone/v1/events.json",events)
          snaps=load("data/phone/v1/snapshots.json")
          old=next(x for x in reversed(snaps) if x["routeId"]==route_id and x["kind"]=="current-profile")
          data=json.loads(json.dumps(old["data"]))
          data["landedCost"].update({"providerOrCommunityPrice":20,"mandatoryTopup":20,"landedOriginal":20,"landedCny":142,"state":"current-official-web-minimum"})
          data["keep"].update({"observedActionCost":10,"yearCostOriginal":40,"yearCostCny":284,"action":"Keep PAYG-only active by purchasing credit before the 90-day expiry. Tello currently allows $10 SMS top-ups (ADD10PAYG) when a card is saved, while the website/manual PAYG purchase floor is $20. Because the SMS path itself depends on a working line, treat $40/year as the lowest documented maintenance path rather than a guaranteed universal checkout floor.","intervalDays":90,"state":"official-sms-topup-path-current"})
          data.update({
            "chinaActivation":"Initial SIM/eSIM activation now explicitly requires physical presence in the United States and a first connection to Tello U.S. network towers. International roaming likewise requires prior U.S. line use. Do not present China-first activation as supported.",
            "wifiCalling":"Tello officially supports Wi-Fi Calling & Text abroad after U.S. activation, including OTP/verification SMS in its current help surfaces. 2026 community reports nevertheless show that overseas SMS can fail or stop on some lines, so treat it as useful but not guaranteed continuity.",
            "roamingSms":"International roaming in 200+ destinations draws from PAYG credit and requires prior U.S. line use. PAYG-only credit can fund roaming, but local partner availability and account/line state still matter.",
            "trend":"watch",
            "guideEligible":False,
            "holdReason":"The route remains a valid real-mobile PAYG product, but it is not a safe China-first recommendation: first activation and roaming require prior U.S. network use, 2026 community reports include Codex verification-SMS failure and overseas SMS interruption, and account-security checks can disrupt continuity. Keep backstage and treat service-specific success as unquantified until exact PAYG-only app observations are independently reproduced.",
            "lastVerifiedAt":"2026-10-05",
            "tariffSummary":"Initial/manual web PAYG purchase starts at $20. Standalone PAYG expires after 90 days; with a saved card, Tello documents $10 SMS top-ups (ADD10PAYG), yielding a lowest documented maintenance path of about $40 per 360 days. First activation and roaming require prior U.S. network use.",
            "sourceIds":list(dict.fromkeys(data.get("sourceIds",[])+[s["id"] for s in new_sources])),
            "guideSteps":[
              "Buy at least $20 of PAYG credit and complete first activation while physically in the United States on Tello network towers.",
              "For PAYG-only retention, renew before 90 days. A saved card enables documented $10 SMS top-ups; website/manual purchases still start at $20.",
              "Before leaving the U.S., verify Wi-Fi Calling & Text and, if needed, enable international roaming after the line has been used on the U.S. network.",
              "Treat overseas OTP/SMS as non-guaranteed: 2026 community evidence includes Codex verification failure and an abrupt overseas SMS interruption case.",
              "Do not use this as a primary irreplaceable number without a recovery/port-out plan because account security checks are an unquantified continuity risk."
            ]
          })
          snap={"id":"snap-tello-paygo-credit-2026-current-profile-20261005","routeId":route_id,"kind":"current-profile","checkedAt":"2026-10-05","sourceDataset":"tello-payg-evidence-maintenance-2026-10-05","data":data}
          if not any(x["id"]==snap["id"] for x in snaps): snaps.append(snap)
          dump("data/phone/v1/snapshots.json",snaps)
          print("routes",len(routes),"sources",len(sources),"events",len(events),"snapshots",len(snaps))
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path("PROJECT_CONTEXT.md"); s=p.read_text()
          s=s.replace("Canonical is now 159 routes / 87 markets / 156 brands / 117 networks / 633 sources, covering","Canonical is now 159 routes / 87 markets / 156 brands / 117 networks / 641 sources, covering",1)
          s=s.replace("- Phone normalized canonical: **159 routes / 87 markets / 156 brands / 117 networks / 633 sources**.","- Phone normalized canonical: **159 routes / 87 markets / 156 brands / 117 networks / 641 sources**.")
          s=s.replace("Current state is 159 routes / 87 markets / 156 brands / 117 networks / 633 sources;","Current state is 159 routes / 87 markets / 156 brands / 117 networks / 641 sources;",1)
          anchor="## Latest maintenance checkpoint — Ultra + H2O evidence density\n"
          insert="""## Latest maintenance checkpoint — Tello PAYG current-rule and continuity reconciliation\n\nThe 2026-10-05 Tello maintenance refreshes existing route `tello-paygo-credit-2026` with four current first-party help sources and four independent/provider-community risk sources. Current first-party rules now make the U.S.-first boundary explicit: first SIM/eSIM activation requires physical U.S. presence and a first connection to Tello U.S. towers; international roaming also requires prior U.S. line use. PAYG-only remains a current product. Initial/manual web PAYG purchase starts at US$20, but Tello documents `ADD10PAYG` SMS top-ups when a payment card is saved, correcting the lowest documented maintenance path from roughly US$80/year to **US$40 per ~360 days**. 2026 community evidence includes Codex verification-SMS failure and an overseas SMS/2FA interruption case, while Tello itself acknowledges fraud-prevention checks can reject orders. These are route-level risk signals rather than a threshold-qualified exact-app sample, so service success remains unquantified. Tello stays `admitted` + `backstage-only`, but `guideEligible=false` until exact PAYG-only service observations are reproduced. Source corpus is now **641**; canonical/publication counts remain **159 routes / 87 markets / 156 brands / 117 networks**, **135 comparison / 3 indexable / 31 sitemap URLs**.\n\n"""
          if insert not in s: s=s.replace(anchor,insert+anchor,1)
          old="7. **PARALLEL — community/provider evidence maintenance.** PR #390 matured ClubSIM Telegram evidence; PR #394 matured Ultra Mobile PayGo Telegram evidence to n=5 / 60.0% observed success / grade C; the 2026-10-05 H2O PayGo pass reconciles conflicting overseas Wi-Fi Calling evidence without manufacturing app observations and keeps H2O HOLD. Continue one-route-at-a-time maintenance; no new DB batch without a genuinely distinct evidence-qualified route trigger."
          new="7. **PARALLEL — community/provider evidence maintenance.** ClubSIM, Ultra Mobile, H2O PayGo and Tello PAYG now have bounded evidence-maintenance passes. Tello adds current U.S.-first activation/roaming rules, a corrected lowest documented US$10/90-day SMS top-up retention path, and route-level SMS/account risk evidence without manufacturing app success rates. Continue one-route-at-a-time maintenance; no new DB batch without a genuinely distinct evidence-qualified route trigger."
          s=s.replace(old,new)
          p.write_text(s)
          p=Path("docs/MASTER_PLAN.md"); s=p.read_text()
          s=s.replace("now place canonical v1 at **159 routes / 87 markets / 156 brands / 117 networks / 633 sources**","now place canonical v1 at **159 routes / 87 markets / 156 brands / 117 networks / 641 sources**",1)
          s=s.replace("leave canonical at **159 routes / 87 markets / 156 brands / 117 networks / 633 sources**","leave canonical at **159 routes / 87 markets / 156 brands / 117 networks / 641 sources**",1)
          old="5. **PARALLEL — evidence-density maintenance.** PR #390 matured ClubSIM Telegram registration to **n=7 / 28.6% observed success / grade C**; PR #394 matured Ultra Mobile PayGo Telegram registration to **n=5 / 60.0% observed success / grade C**. The 2026-10-05 H2O PayGo pass adds three independent route-level continuity sources and preserves HOLD because current Wi-Fi Calling evidence conflicts; it creates no app percentage without exact app observations. Continue one-route-at-a-time evidence maintenance and separate Data-eSIM intake; re-open a DB batch only for a genuinely new evidence-qualified atomic route."
          new="5. **PARALLEL — evidence-density maintenance.** ClubSIM and Ultra now have threshold-qualified Telegram samples; H2O and Tello have route-level continuity/risk maintenance without invented percentages. The Tello pass also corrects its lowest documented PAYG-only retention path to US$10 top-ups every 90 days after the initial purchase, while preserving the U.S.-first activation/roaming boundary. Continue one-route-at-a-time evidence maintenance and separate Data-eSIM intake; re-open a DB batch only for a genuinely new evidence-qualified atomic route."
          s=s.replace(old,new)
          p.write_text(s)
          p=Path("docs/CURRENT_EXECUTION_QUEUE.md"); s=p.read_text()
          s=s.replace("159 canonical routes / 87 markets / 156 brands / 117 networks / 633 sources","159 canonical routes / 87 markets / 156 brands / 117 networks / 641 sources",1)
          start=s.index("## JUST COMPLETED — H2O PayGo overseas-continuity evidence maintenance")
          end=s.index("## External waits")
          new="""## JUST COMPLETED — H2O PayGo overseas-continuity evidence maintenance\n\n- Existing route `h2o-paygo-10-90d-2026` gained three independent route-level sources and remains `hold` + `backstage-only`.\n- Conflicting PayGo Wi-Fi Calling evidence is preserved as route-level uncertainty; no app success percentage was created.\n- Source corpus reached **633** with public boundary unchanged.\n\n## JUST COMPLETED — Tello PAYG current-rule + continuity maintenance\n\n- Existing route: `tello-paygo-credit-2026`, real-mobile, `admitted` + `backstage-only`.\n- Added 8 current/recent sources: 4 first-party Tello help pages plus 4 community/provider-community sources covering PAYG lifecycle, U.S.-first activation/roaming, Codex verification-SMS failure, overseas SMS interruption, account-security risk and a current China-use/retention guide.\n- Corrected economics: initial/manual web PAYG purchase remains **US$20**, but Tello currently documents `ADD10PAYG` SMS top-ups with a saved card; lowest documented PAYG-only keep path is therefore **US$10 / 90 days (~US$40 / 360 days)** instead of the stale US$80/year assumption.\n- Current first-party boundary: initial SIM/eSIM activation must occur physically in the U.S. on Tello towers; international roaming requires prior U.S. line use.\n- Community risk is mixed and not plan-isolated enough for an exact app aggregate. Preserve zero service observations/percentages; set `guideEligible=false` while keeping the route admitted/backstage-only.\n- Source corpus becomes **641**. Canonical remains **159 routes / 87 markets / 156 brands / 117 networks**; public boundary remains **135 comparison / 3 indexable / 31 sitemap URLs**.\n\n## NEXT — continue database maintenance, no invented expansion\n\n1. **Next bounded route:** reconcile `redpocket-annual-2026`. It still has zero service observations and its current snapshot contains stale guide/acquisition wording alongside newer US$80 first-year / US$110 renewal metrics. Fix source-backed economics and continuity wording first, then seek exact service evidence.\n2. **Search Console gate:** publication remains held until the explicit measurement gate is met; database maintenance continues independently.\n3. **Database expansion:** no currently known evidence-qualified atomic residual remains outside canonical; do not create DB-C24 merely to raise counts.\n4. **Data-eSIM:** keep append-only community intake separate from Phone-number canonical.\n5. **Frontend:** no new URL or redesign from this maintenance work.\n\nDelegated Qwen/Kimi output remains `RESEARCH_CANDIDATE` until coordinator review and cannot bypass evidence/admission/publication gates.\n\n"""
          s=s[:start]+new+s[end:]
          p.write_text(s)
          PY
          cat > scripts/test-phone-tello-payg-maintenance.mjs <<'EOF'
          import fs from "node:fs";
          import assert from "node:assert/strict";
          const read = p => JSON.parse(fs.readFileSync(p, "utf8"));
          const routes = read("data/phone/v1/routes.json");
          const sources = read("data/phone/v1/sources.json");
          const observations = read("data/phone/v1/observations.json");
          const events = read("data/phone/v1/events.json");
          const detail = read("frontend/tools/phone-number-lifecycle-mvp/phone-route-data/tello-paygo-credit-2026.json");
          const summary = read("frontend/tools/phone-number-lifecycle-mvp/phone-route-summaries.json").routes.find(x => x.id === "tello-paygo-credit-2026");
          const route = routes.find(x => x.id === "tello-paygo-credit-2026");
          assert(route);
          assert.equal(route.surfaceState, "backstage-only");
          assert.equal(route.evidenceState, "admitted");
          assert.equal(route.lastVerifiedAt, "2026-10-05");
          const ids=["official-tello-payg-current-20261005","official-tello-payg-sms-topup-20261005","official-tello-activation-us-required-20261005","official-tello-roaming-us-first-20261005","linuxdo-tello-codex-sms-failure-20260612","reddit-tello-sms-cut-abroad-20260925","reddit-tello-signup-security-20260702","nodeseek-tello-payg-guide-20260928"];
          for (const id of ids) { assert(route.sourceIds.includes(id)); assert(sources.some(x=>x.id===id)); }
          assert(events.some(x=>x.id==="evt-tello-payg-current-rules-20261005"));
          assert(events.some(x=>x.id==="evt-tello-overseas-sms-risk-20261005"));
          assert(events.some(x=>x.id==="evt-tello-account-security-risk-20261005"));
          assert.equal(observations.filter(x=>x.routeId===route.id).length,0);
          assert.equal(detail.serviceEvidence.length,0);
          assert(summary);
          assert.equal(summary.serviceEvidence.length,0);
          assert.equal(summary.decisionFacts.sourceCount,14);
          assert.equal(detail.metrics.keepYearCostOriginal,40);
          assert.equal(detail.metrics.keepIntervalDays,90);
          const latest=detail.snapshots.at(-1);
          assert.equal(latest.id,"snap-tello-paygo-credit-2026-current-profile-20261005");
          assert.equal(latest.data.keep.observedActionCost,10);
          assert.equal(latest.data.guideEligible,false);
          assert.match(latest.data.chinaActivation,/requires physical presence in the United States/);
          assert.match(latest.data.holdReason,/Codex verification-SMS failure/);
          console.log("Tello PAYG evidence maintenance OK");
          EOF
          python3 - <<'PY'
          import json
          p="package.json"; d=json.load(open(p)); s=d["scripts"]["phone:data:check"]
          needle=" && node scripts/test-phone-h2o-paygo-maintenance.mjs"
          if "test-phone-tello-payg-maintenance.mjs" not in s:
              assert needle in s
              d["scripts"]["phone:data:check"]=s.replace(needle,needle+" && node scripts/test-phone-tello-payg-maintenance.mjs")
          open(p,"w").write(json.dumps(d,indent=2)+"\n")
          PY
          node scripts/build-phone-database.mjs
      - name: Validate
        shell: bash
        run: |
          npm ci --ignore-scripts
          npm run phone:data:check
          npm ci --prefix frontend
          npm run build --prefix frontend
          node scripts/test-phone-number-public-release.mjs
          git diff --check
      - name: Commit final branch state
        shell: bash
        run: |
          rm -f .github/workflows/bootstrap-tello-evidence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "data(phone): reconcile Tello PAYG retention evidence"
          git push origin HEAD:phone/tello-evidence-20261005
