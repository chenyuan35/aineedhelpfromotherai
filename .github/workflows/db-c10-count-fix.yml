name: DB-C10 Count Fix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'docs/db-c10-count-fix-20261001'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Fix stale DB-C10 count
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/CURRENT_EXECUTION_QUEUE.md')
          s=p.read_text()
          old='- do not bulk-admit the remaining 30 legacy-only routes without provenance + QC;'
          new='- do not bulk-admit the remaining 27 legacy-only route IDs without provenance + QC;'
          if old in s:
              p.write_text(s.replace(old,new))
          elif new not in s:
              raise SystemExit('expected queue line not found')
          PY
          git diff --check
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/CURRENT_EXECUTION_QUEUE.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: correct remaining Phone route count'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
