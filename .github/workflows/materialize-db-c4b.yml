name: materialize-db-c4b
on:
  push:
    branches:
      - phone/db-c4b-20260929
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply staged DB-C4B patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/db-c4b-part-* > /tmp/db-c4b.patch.gz.b64
          base64 -d /tmp/db-c4b.patch.gz.b64 | gunzip > /tmp/db-c4b.patch
          git apply --index /tmp/db-c4b.patch
          rm -f .github/db-c4b-part-* .github/workflows/materialize-db-c4b.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data(phone): process DB-C4B routes"
          git push origin HEAD:phone/db-c4b-20260929
