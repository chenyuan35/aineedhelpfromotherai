name: DB-C10 Closeout

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  closeout:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'docs/db-c10-closeout-20261001'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply reviewed fact-source patch
        run: |
          if grep -q 'DB-C10 is released with' docs/CURRENT_EXECUTION_QUEUE.md; then
            echo 'Closeout patch already applied.'
          else
            git apply --check .tmp/db-c10-closeout.patch
            git apply .tmp/db-c10-closeout.patch
          fi
      - name: Verify docs diff
        run: |
          git diff --check
          grep -q 'DB-C11' PROJECT_CONTEXT.md
          grep -q 'DB-C11' docs/CURRENT_EXECUTION_QUEUE.md
          grep -q 'DB-C10 — completed 2026-10-01' docs/PHONE_DATABASE_COVERAGE_EXECUTION_2026-09-29.md
      - name: Commit fact sources
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add PROJECT_CONTEXT.md docs/CURRENT_EXECUTION_QUEUE.md docs/MASTER_PLAN.md docs/PHONE_DATABASE_COVERAGE_EXECUTION_2026-09-29.md
          if git diff --cached --quiet; then
            echo 'No fact-source changes to commit.'
          else
            git commit -m 'docs: close DB-C10 and queue DB-C11'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
