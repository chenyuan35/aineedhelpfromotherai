name: Apply audited historical backend hardening

on:
  push:
    branches:
      - docs/record-historical-audit-20260917
    paths:
      - '.github/workflows/apply-historical-backend-hardening.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/record-historical-audit-20260917
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply the already-tested patch
        run: node scripts/apply-historical-backend-hardening.mjs
      - name: Syntax check
        run: node -c server.js
      - name: Remove one-time patch helpers
        run: |
          rm scripts/apply-historical-backend-hardening.mjs
          rm .github/workflows/apply-historical-backend-hardening.yml
      - name: Commit patch to the audit branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js scripts/apply-historical-backend-hardening.mjs .github/workflows/apply-historical-backend-hardening.yml
          git commit -m "security: retire legacy backend surface"
          git push origin HEAD:docs/record-historical-audit-20260917
