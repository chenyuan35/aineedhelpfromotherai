name: DB C2 Bootstrap

on:
  push:
    branches:
      - data/phone-db-c2-20260929
    paths:
      - .github/db-c2.patch.gz.b64
      - .github/workflows/db-c2-bootstrap.yml

permissions:
  contents: write

jobs:
  apply-db-c2:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: data/phone-db-c2-20260929
          fetch-depth: 0

      - name: Decode and verify patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/db-c2.patch.gz.b64 | gzip -d > /tmp/db-c2.patch
          echo "efcd2447131ad3cb24fa4a3f5f93b24f7a665403c4172692b981a12bd70e9b55  /tmp/db-c2.patch" | sha256sum -c -

      - name: Apply DB-C2 patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --index --binary /tmp/db-c2.patch
          git diff --cached --check

      - name: Verify Phone database
        shell: bash
        run: |
          set -euo pipefail
          npm run phone:data:check

      - name: Commit DB-C2 and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/db-c2.patch.gz.b64 .github/workflows/db-c2-bootstrap.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data(phone): complete DB-C2 coverage batch"
          git push origin HEAD:data/phone-db-c2-20260929
