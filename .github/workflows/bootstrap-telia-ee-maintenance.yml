name: Bootstrap Telia Estonia maintenance

on:
  push:
    branches:
      - phone/telia-ee-maintenance-20261005
    paths:
      - '.github/workflows/bootstrap-telia-ee-maintenance.yml'

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: phone/telia-ee-maintenance-20261005
      - name: Reconstruct and apply verified patch
        shell: bash
        run: |
          set -euo pipefail
          cat _bootstrap/telia-part0.txt _bootstrap/telia-part1.txt _bootstrap/telia-part2.txt _bootstrap/telia-part3.txt > /tmp/telia.patch.gz.b64
          base64 -d /tmp/telia.patch.gz.b64 | gzip -dc > /tmp/telia.patch
          git apply --check /tmp/telia.patch
          git apply /tmp/telia.patch
          rm -rf _bootstrap
          rm -f .github/workflows/bootstrap-telia-ee-maintenance.yml
      - name: Validate Phone data
        run: |
          npm ci --ignore-scripts
          npm run phone:data:check
      - name: Validate frontend and publication boundary
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
          node scripts/test-phone-number-public-release.mjs
          git diff --check
      - name: Commit reviewed Telia Estonia maintenance
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'data(phone): reconcile Telia Estonia Super lifecycle'
          git push origin HEAD:phone/telia-ee-maintenance-20261005
