name: DB-C8 materialize

on:
  push:
    branches:
      - data/phone-db-c8-20260930

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply reviewed DB-C8 packets
        run: |
          node scripts/apply-phone-review-packet.mjs data/phone/review-packets/ahamo-jp-2026.json --apply
          node scripts/apply-phone-review-packet.mjs data/phone/review-packets/iijmio-jp-2026.json --apply
          node scripts/apply-phone-review-packet.mjs data/phone/review-packets/kt-prepaid-kr-2026.json --apply
          npm run phone:data:build
          npm run phone:data:check
      - name: Commit deterministic generated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/phone/v1 frontend/tools/phone-number-lifecycle-mvp
          git commit -m 'data(phone): materialize DB-C8 generated data'
          git push
