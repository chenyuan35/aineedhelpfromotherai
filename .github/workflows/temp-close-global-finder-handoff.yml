name: temp close global finder handoff
on:
  push:
    paths:
      - '.tmp-close-global-finder-handoff'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/close-global-finder-handoff-20260929
      - name: Update checkpoint and self-delete
        shell: python
        run: |
          from pathlib import Path
          p = Path('PROJECT_CONTEXT.md')
          s = p.read_text()
          old = "| Phone Radar | **ACTIVE PRIMARY GROWTH PRODUCT / POST-A–K VALUE CHECKPOINT COMPLETE.** The 93 legacy-only rows are real migration debt, but current search evidence does not make more migration the growth bottleneck. The selected bounded move is to deepen the existing Phone hub from a UK-pilot comparison into a global progressive finder over the admitted 135-route comparison layer. | Ship/verify the global finder without changing route indexability, then measure search + product interaction before choosing another migration/publication move. |"
          new = "| Phone Radar | **ACTIVE PRIMARY GROWTH PRODUCT / GLOBAL FINDER RELEASED.** PR #291 (`3b0ec6e03c078bd0121b378b4d535aa2adda81ff`) shipped the post-A–K bounded move: the existing Phone hub now exposes the admitted 135-route comparison layer through a global progressive finder with compact initial index and lazy deep-data loading. Production is verified; route indexability remains 3. | Keep the released surface stable and measure first-party search + product interaction before choosing another migration/publication move. |"
          if old not in s:
              raise SystemExit('Phone Radar checkpoint needle missing')
          s = s.replace(old, new, 1)
          old2 = "The selected next move is therefore the existing canonical Phone URL: expose the admitted 135-route comparison layer through a compact global finder, while loading deep global evidence only after market/route interaction and preserving the 3-route SEO allowlist. See `docs/PHONE_POST_AK_VALUE_CHECKPOINT_2026-09-29.md`."
          new2 = "That bounded move is now released in PR #291 (`3b0ec6e03c078bd0121b378b4d535aa2adda81ff`): the existing canonical Phone URL exposes the admitted 135-route comparison layer through a compact global finder, loads deep global evidence only after market/route interaction, and preserves the 3-route SEO allowlist. Production verification confirmed hub/index HTTP 200, an admitted VOXI route HTTP 200, and a representative non-indexable Three IE route HTTP 404. See `docs/PHONE_POST_AK_VALUE_CHECKPOINT_2026-09-29.md`."
          if old2 not in s:
              raise SystemExit('Immediate-priority needle missing')
          p.write_text(s.replace(old2, new2, 1))
          Path('.github/workflows/temp-close-global-finder-handoff.yml').unlink()
          Path('.tmp-close-global-finder-handoff').unlink()
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add PROJECT_CONTEXT.md docs/CURRENT_EXECUTION_QUEUE.md .github/workflows/temp-close-global-finder-handoff.yml .tmp-close-global-finder-handoff || true
          git commit -m "docs: close global finder release handoff"
          git push origin HEAD:docs/close-global-finder-handoff-20260929
