name: DB-C4C materialize

on:
  push:
    branches:
      - codex/phone-db-c4c-20260929

permissions:
  contents: write

jobs:
  materialize:
    if: contains(github.event.head_commit.message, '[materialize-db-c4c]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed DB-C4C packets and verify
        shell: bash
        run: |
          set -euo pipefail
          for p in data/phone/review-packets/us-mobile-light-2026.json data/phone/review-packets/lycamobile-us-2026.json data/phone/review-packets/orange-sn-sama-numero-2026.json; do
            node scripts/apply-phone-review-packet.mjs "$p" --check
            node scripts/apply-phone-review-packet.mjs "$p" --apply
          done
          node scripts/build-phone-database.mjs
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          const add=' && node scripts/test-phone-canonical-db-c4c-migration.mjs';
          if(!p.scripts['phone:data:check'].includes('test-phone-canonical-db-c4c-migration.mjs')) p.scripts['phone:data:check']+=add;
          fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          NODE
          python3 - <<'PYDOC'
          from pathlib import Path
          import re
          p=Path('PROJECT_CONTEXT.md'); s=p.read_text()
          s=re.sub(r'^\| Phone Radar \|.*$', '| Phone Radar | **ACTIVE PRIMARY GROWTH PRODUCT / GLOBAL FINDER RELEASED.** PR #291 (`3b0ec6e03c078bd0121b378b4d535aa2adda81ff`) shipped the 135-route global progressive finder. DB-C4C has now expanded only the backstage normalized database to 98 routes; the public comparison surface remains 135 routes and route indexability remains 3. | Keep the released frontend stable while backend evidence/database coverage continues independently; publication still requires a separate gate. |', s, count=1, flags=re.M)
          s=re.sub(r'^\| Phone data / publication foundation \|.*$', '| Phone data / publication foundation | **135-ROUTE COMPARISON / 98-ROUTE CANONICAL / 3 INDEXABLE.** DB-C4C added US Mobile Light, Lyca Mobile US and Orange Senegal Sama Numéro after independent review; canonical `data/phone/v1` is 98 routes / 54 markets / 95 brands / 74 networks / 323 sources; 87 route IDs overlap the 135-route comparison set and 48 remain legacy-only. Publication remains a separate layer. | Continue DB-C4 from the remaining reviewed legacy-only set; preserve the 3-route indexability allowlist and do not equate database admission with SEO publication. |', s, count=1, flags=re.M)
          s=re.sub(r'^DB-C1 through DB-C3 then resumed backend coverage as a separate track rather than another publication wave\..*$', 'DB-C1 through DB-C3 then resumed backend coverage as a separate track rather than another publication wave. DB-C2 PR #303 (`11177dd8d1e316e0069dcc5f78203d4af7da60dd`) reached 77 canonical routes; DB-C3 PR #305 (`82299c03500f029db1fb6241fbaaf4d5bcbcb3f0`) reached 89. DB-C4A then independently sample-audited and normalized FROG, Optus Flex Plus and Lebara France: FROG is ADMIT-BACKSTAGE with the current EUR13 electronic top-up minimum; Optus is HOLD across its scheduled 2026-09-30 price change; Lebara France is HOLD after correcting the host network to SFR and separating recharge validity from the 90-day no-service-use termination rule. DB-C4B then reviewed Smart Prepaid, MTN Nigeria Keep My Number and iD Mobile: Smart stays HOLD because foreign-tourist registration is capped at 30 days unless an approved visa extension is supplied; MTN is ADMIT-BACKSTAGE with current NGN3,500/1y, NGN5,000/2y and NGN7,500/3y Keep My Number pricing plus the visitor-under-24-month NIN exception; iD stays HOLD because current legal terms use a 120-day/four-month inactivity clock while current provider marketing/community copy says 180 days. DB-C4C then reviewed US Mobile Light, Lyca Mobile US and Orange Senegal Sama Numéro: US Mobile stays HOLD because native roaming requires prior U.S. domestic usage; Lyca stays HOLD with its official 60-day non-use clock while the old USD120/year minimum is withdrawn and lowest-cost keep-alive remains unresolved; Orange Sama Numéro is ADMIT-BACKSTAGE with current XOF3,000/6mo, XOF5,000/12mo and XOF10,000/24mo retention pricing. Canonical coverage is now 98 routes / 54 markets / 95 brands / 74 networks / 323 sources, with 87 comparison↔canonical route-ID overlaps and 48 comparison routes still legacy-only. Full Phone checks preserve 135 comparison routes / 3 explicit indexable routes. No public URL expansion is authorized by DB-C4.', s, count=1, flags=re.M)
          s=s.replace('Continue from the remaining 51 legacy-only comparison routes','Continue from the remaining 48 legacy-only comparison routes')
          p.write_text(s)
          p=Path('docs/CURRENT_EXECUTION_QUEUE.md'); s=p.read_text()
          s=s.replace('After DB-C4B: **135 comparison routes / 95 canonical normalized routes / 84 comparison↔canonical route-ID overlaps / 51 comparison routes still legacy-only / 3 indexable routes**','After DB-C4C: **135 comparison routes / 98 canonical normalized routes / 87 comparison↔canonical route-ID overlaps / 48 comparison routes still legacy-only / 3 indexable routes**')
          s=s.replace('## JUST COMPLETED — Backend database coverage DB-C4B','## JUST COMPLETED — Backend database coverage DB-C4C')
          s=re.sub(r'^Result: \*\*1 ADMIT-BACKSTAGE / 2 HOLD / 0 REJECT\*\*\..*$', 'Result: **1 ADMIT-BACKSTAGE / 2 HOLD / 0 REJECT**. US Mobile Light is HOLD: USD 96/year remains current, but native roaming requires prior U.S. domestic usage and some Wi-Fi Calling setup is U.S.-side. Lyca Mobile US is HOLD: the official 60-day non-use clock remains current, while the legacy USD 120/year minimum is withdrawn and exact lowest-cost keep-alive plus China-first behavior remain unresolved; 2026 AT&T-migration incidents are retained. Orange Senegal Sama Numéro is ADMIT-BACKSTAGE with current XOF3,000/6mo, XOF5,000/12mo and XOF10,000/24mo provider pricing and explicit airtime/Orange Money subscription paths.', s, count=1, flags=re.M)
          s=re.sub(r'Canonical result after DB-C4B:.*?\n\nRelease:.*?\n\n## ACTIVE', 'Canonical result after DB-C4C: **98 routes / 54 markets / 95 brands / 74 networks / 323 sources**. Comparison remains **135**, comparison↔canonical overlap is **87**, **48 comparison routes remain legacy-only**, and explicit indexability remains **3**. Full Phone checks preserve the 135-route comparison surface and 3-route publication boundary.\n\n## ACTIVE', s, count=1, flags=re.S)
          s=re.sub(r'Candidates:\n\n1\. `us-mobile-light-2026`.*?6\. `hotmobile-il-2026`', 'Candidates:\n\n1. `elisa-prepaid-fi-2026`\n2. `cyta-soeasy-cy-2026`\n3. `hotmobile-il-2026`', s, count=1, flags=re.S)
          s=s.replace('remaining 51 legacy-only routes','remaining 48 legacy-only routes')
          p.write_text(s)
          p=Path('docs/MASTER_PLAN.md'); s=p.read_text()
          s=re.sub(r'^The UK matrix was the first public baseline,.*$', 'The UK matrix was the first public baseline, and backstage evidence acquisition continues independently of Search Console. After the global data expansion, PR #261 separates broad database coverage from public/indexable page coverage so the database can grow without recreating programmatic SEO families. PR #263 separately makes legacy comparison-database admission explicit: wildcard batch discovery is gone, existing admitted legacy batches are named in a reviewed manifest, and unlisted delegated research stays outside comparison inputs. The Sep 28 compatibility audit found canonical v1 at 15 routes with only four route-ID overlaps; staged reviewed migrations plus backend coverage through DB-C4C have since raised canonical v1 to 98 routes / 54 markets / 95 brands / 74 networks / 323 sources with 87 route-ID overlaps. Forty-eight comparison routes remain legacy-only; the 135-route comparison surface and 3-route explicit publication boundary remain unchanged.', s, count=1, flags=re.M)
          s=re.sub(r'^42\. \*\*ACTIVE — backend database coverage DB-C4.*$', '42. **ACTIVE — backend database coverage DB-C4 / DB-C4C COMPLETE.** DB-C4A sample-audited FROG / Optus Flex Plus / Lebara France. DB-C4B reviewed Smart Prepaid / MTN Nigeria Keep My Number / iD Mobile. DB-C4C then reviewed US Mobile Light (HOLD: prior U.S. domestic usage required for native roaming), Lyca Mobile US (HOLD: 60-day non-use clock current; stale USD120/year minimum withdrawn; cheapest keep-alive unresolved), and Orange Senegal Sama Numéro (ADMIT-BACKSTAGE: XOF3,000/6mo, XOF5,000/12mo, XOF10,000/24mo). Canonical coverage is now 98 routes / 54 markets / 95 brands / 74 networks / 323 sources, with 87 comparison↔canonical route-ID overlaps and 48 comparison routes still legacy-only. Continue the remaining DB-C4 candidates from `docs/CURRENT_EXECUTION_QUEUE.md`; preserve provenance, uncertainty and the independent publication gate.', s, count=1, flags=re.M)
          p.write_text(s)
          p=Path('docs/PHONE_DATABASE_COVERAGE_EXECUTION_2026-09-29.md'); s=p.read_text()
          if '## DB-C4C — completed 2026-09-29' not in s:
              s += """\n## DB-C4C — completed 2026-09-29\n\nThe next three DB-C4 candidates were independently reviewed and normalized through approved backstage packets. Final DB-C4C disposition: **1 ADMIT-BACKSTAGE / 2 HOLD / 0 REJECT**.\n\n- `us-mobile-light-2026` — HOLD. Current Light pricing remains USD10/month or USD96/year. Native roaming requires prior domestic U.S. usage, and Warp/Dark Star Wi-Fi Calling setup requires U.S. coverage; a general China-first route is not established.\n- `lycamobile-us-2026` — HOLD. Current official terms retain the 60-day non-use expiry. The old USD120/year minimum is withdrawn because current long-term pricing includes USD108/12 months, while exact minimum PAYG keep-alive economics remain unresolved. Current evidence places service on AT&T and preserves 2026 migration incidents without converting them into a failure-rate claim.\n- `orange-sn-sama-numero-2026` — ADMIT-BACKSTAGE. Current Sama Numéro pricing is XOF3,000/6 months, XOF5,000/12 months and XOF10,000/24 months, payable from airtime or Orange Money; validity begins at subscription. Teeru tourist SIM/eSIM also explicitly supports extension through Sama Numéro.\n\nPost-DB-C4C state: **98 canonical routes / 54 markets / 95 brands / 74 networks / 323 sources / 87 comparison-overlap route IDs / 48 comparison routes still legacy-only / 3 explicit indexable routes**. Full Phone checks preserve **135 comparison routes / 3 explicit indexable routes**.\n\nDB-C4 remains active with `elisa-prepaid-fi-2026`, `cyta-soeasy-cy-2026` and `hotmobile-il-2026` as the next bounded candidates.\n"""
          p.write_text(s)
          PYDOC
          npm run phone:data:check
          node frontend/bin/build.mjs
          node scripts/test-phone-number-public-release.mjs
          test "$(node -e "const r=require('./data/phone/v1/routes.json');console.log(r.length)")" = 98
          test "$(node -e "const p=require('./frontend/tools/phone-number-lifecycle-mvp/publication-policy.json');console.log(Object.values(p.routeStates).filter(x=>x==='indexable').length)")" = 3
          rm -f .github/workflows/db-c4c-materialize.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Phone: process DB-C4C routes'
          git push origin "HEAD:${GITHUB_REF_NAME}"
