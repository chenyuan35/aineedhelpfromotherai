name: DB-C4C materialize

on:
  push:
    branches:
      - codex/phone-db-c4c-20260929

permissions:
  contents: write

jobs:
  materialize:
    if: contains(github.event.head_commit.message, '[materialize-db-c4c]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and apply exact local patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          cat .tmp/db-c4c.part.* > /tmp/db-c4c.patch.gz.b64
          echo 'af92ee293084874355ed326f96c136bf55c172b4787aca5b5a13385a639ed5e2  /tmp/db-c4c.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/db-c4c.patch.gz.b64 > /tmp/db-c4c.patch.gz
          echo '05cdc863886e33df3cef1f76368050405242daebb7398fea9eb21989d085b636  /tmp/db-c4c.patch.gz' | sha256sum -c -
          gzip -dc /tmp/db-c4c.patch.gz > /tmp/db-c4c.patch
          git apply --check /tmp/db-c4c.patch
          git apply /tmp/db-c4c.patch
          rm -f .tmp/db-c4c.part.* .github/workflows/db-c4c-materialize.yml
          rmdir .tmp 2>/dev/null || true
          git diff --check
          mapfile -t changed < <(git diff --name-only origin/main)
          test "${#changed[@]}" = "23"
          if printf '%s\n' "${changed[@]}" | grep -Eq '^(\.tmp/|\.github/workflows/db-c4c-materialize\.yml$)'; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Phone: process DB-C4C routes'
          git push origin "HEAD:${GITHUB_REF_NAME}"
