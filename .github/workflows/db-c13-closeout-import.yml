name: DB-C13 closeout import

on:
  push:
    branches:
      - docs/db-c13-closeout-20261002

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified closeout patch and remove importer
        shell: bash
        run: |
          cat .github/db-c13-closeout.patch.part* > /tmp/db-c13-closeout.b64
          echo 'cef4a44b7832c3bb9088153eb11d6a465819758ba8c6d304851c1780a95b0428  /tmp/db-c13-closeout.b64' | sha256sum -c -
          base64 -d /tmp/db-c13-closeout.b64 | gzip -d > /tmp/db-c13-closeout.patch
          git apply --check /tmp/db-c13-closeout.patch
          git apply /tmp/db-c13-closeout.patch
          rm .github/db-c13-closeout.patch.part* .github/workflows/db-c13-closeout-import.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: close DB-C13 and queue DB-C14'
          git push origin HEAD:docs/db-c13-closeout-20261002
