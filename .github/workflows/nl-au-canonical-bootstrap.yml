name: NL AU canonical bootstrap

on:
  push:
    branches:
      - feat/phone-canonical-repeatability-nl-au-20260928

permissions:
  contents: write

jobs:
  apply-tested-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified local patch
        shell: bash
        run: |
          cat > /tmp/nl-au.patch.gz.b64 <<'PATCH'
          
          PATCH
          tr -d '[:space:]' < /tmp/nl-au.patch.gz.b64 | base64 -d | gzip -d > /tmp/nl-au.patch
          echo '8fb87a159b00f8d1d518dd303fc467d7560ae5f6365a002efb1309650f05bf92  /tmp/nl-au.patch' | sha256sum -c -
          git apply --check /tmp/nl-au.patch
          git apply /tmp/nl-au.patch
          npm run phone:data:check
      - name: Commit exact pilot tree
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/nl-au-canonical-bootstrap.yml
          git add -A
          git commit -m 'feat(phone): repeat canonical migration across NL AU'
          git push origin HEAD:feat/phone-canonical-repeatability-nl-au-20260928
