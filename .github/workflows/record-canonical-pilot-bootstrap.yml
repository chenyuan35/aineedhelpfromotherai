name: Record canonical pilot facts

on:
  push:
    branches:
      - docs/record-canonical-pilot-20260928

permissions:
  contents: write

jobs:
  apply-doc-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified docs patch
        shell: bash
        run: |
          cat > /tmp/docs.patch.gz.b64 <<'PATCH'
          
          PATCH
          tr -d '[:space:]' < /tmp/docs.patch.gz.b64 | base64 -d | gzip -d > /tmp/docs.patch
          echo '16353385ba19b45141d3410f0f20e02e32410241739a8ea9885b02fe6b70241b  /tmp/docs.patch' | sha256sum -c -
          git apply --check /tmp/docs.patch
          git apply /tmp/docs.patch
          git diff --check
      - name: Commit fact-source update
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/record-canonical-pilot-bootstrap.yml
          git add PROJECT_CONTEXT.md docs/CURRENT_EXECUTION_QUEUE.md docs/MASTER_PLAN.md
          git commit -m 'docs: record canonical migration pilot result'
          git push origin HEAD:docs/record-canonical-pilot-20260928
