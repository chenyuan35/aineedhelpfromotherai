name: tmp-phone-alias-fix
on:
  push:
    branches:
      - "feat/phone-canonical-finder-20261003"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phone-canonical-finder-20261003
          fetch-depth: 0
      - name: Apply verified alias patch once
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "canonicalLegacyAliases" frontend/tools/phone-number-lifecycle-mvp/index.html && grep -q "canonical Sakura alias" scripts/test-phone-number-public-release.mjs; then
            echo "Alias patch already materialized"
            exit 0
          fi
          base64 -d .github/tmp-phone-alias.patch.gz.b64 | gzip -d > /tmp/phone-alias.patch
          git apply --check /tmp/phone-alias.patch
          git apply /tmp/phone-alias.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/tools/phone-number-lifecycle-mvp/index.html scripts/test-phone-number-public-release.mjs
          git commit -m "fix: dedupe canonical Phone aliases in market view"
          git push origin HEAD:feat/phone-canonical-finder-20261003
