name: DB-C20 closeout materializer

on:
  push:
    branches: [docs/db-c20-closeout-20261003]
    paths:
      - '.github/workflows/db-c20-closeout-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/db-c20-closeout-20261003
          fetch-depth: 0
      - name: Apply verified closeout patch
        run: |
          printf '%s' '' > /tmp/db-c20-closeout.patch.gz.b64
          echo '4e959d84cfd401f4e0ecaa073f93268e62038144f03c17a0e1b06a3105c35bc2  /tmp/db-c20-closeout.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/db-c20-closeout.patch.gz.b64 | gzip -d > /tmp/db-c20-closeout.patch
          echo '85bf87fdd69b42e4e144fb03dc1be71dd20064c94fadd9bb9f3a72f0c3528c44  /tmp/db-c20-closeout.patch' | sha256sum -c -
          git apply --check /tmp/db-c20-closeout.patch
          git apply /tmp/db-c20-closeout.patch
          rm -f .github/workflows/db-c20-closeout-materialize.yml
      - name: Commit closeout facts
        run: |
          git config user.name 'aineedhelp-bot'
          git config user.email 'bot@aineedhelpfromotherai.com'
          git add -A
          git commit -m 'docs: close out DB-C20'
          git push origin HEAD:docs/db-c20-closeout-20261003
