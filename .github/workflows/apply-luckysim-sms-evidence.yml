name: Apply LuckySIM SMS evidence maintenance

on:
  push:
    branches:
      - data/luckysim-sms-evidence-20261004
    paths:
      - .github/workflows/apply-luckysim-sms-evidence.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply evidence changes
        run: node .github/tmp/apply-luckysim-sms-evidence.cjs
      - name: Install root dependencies
        run: npm ci
      - name: Build and verify Phone data
        run: |
          npm run phone:data:build
          npm run phone:data:check
      - name: Build frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
      - name: Verify public boundary
        run: |
          node scripts/test-phone-number-public-release.mjs
          git diff --check
      - name: Commit generated maintenance
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/tmp/apply-luckysim-sms-evidence.cjs .github/workflows/apply-luckysim-sms-evidence.yml
          git add PROJECT_CONTEXT.md docs data frontend scripts package.json
          git commit -m "data(phone): refresh LuckySIM SMS evidence"
          git push origin HEAD:${GITHUB_REF_NAME}
