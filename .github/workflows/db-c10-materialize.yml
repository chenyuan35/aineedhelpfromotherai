name: DB-C10 Materialize

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'db/db-c10-20261001'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply reviewed DB-C10 packets
        run: |
          node scripts/apply-phone-review-packet.mjs data/phone/review-packets/starhub-prepaid-sg-2026.json --apply
          node scripts/apply-phone-review-packet.mjs data/phone/review-packets/jazz-pk-2026.json --apply
          node scripts/apply-phone-review-packet.mjs data/phone/review-packets/vodafone-eg-2026.json --apply
          npm run phone:data:build
      - name: Verify materialized tree
        run: |
          npm run phone:data:check
          npm run verify
          git diff --check
      - name: Commit generated canonical data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/phone/v1 \
            frontend/tools/phone-number-lifecycle-mvp/phone-database.json \
            frontend/tools/phone-number-lifecycle-mvp/phone-route-data \
            frontend/tools/phone-number-lifecycle-mvp/phone-route-metrics.json \
            frontend/tools/phone-number-lifecycle-mvp/phone-route-summaries.json \
            frontend/tools/phone-number-lifecycle-mvp/phone-search-index.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'data: materialize DB-C10 canonical outputs'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
