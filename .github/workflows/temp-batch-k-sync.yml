name: temp batch-k sync
on:
  push:
    branches:
      - phone/ie-pl-pt-hr-batch-k-current-facts-20260929
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phone/ie-pl-pt-hr-batch-k-current-facts-20260929
          fetch-depth: 0
      - name: Apply verified patch
        shell: bash
        run: |
          set -euo pipefail
          curl -fSL 'https://360eeae880efff82-47-84-122-196.serveousercontent.com/batch-k.patch' -o /tmp/batch-k.patch
          echo 'bd7379c65c361a44adf0aab1b647ddb5b0f41012534a7017ddac955aa690fd27  /tmp/batch-k.patch' | sha256sum -c -
          git apply --check /tmp/batch-k.patch
          git apply /tmp/batch-k.patch
          git rm .github/workflows/temp-batch-k-sync.yml
          git rm .batch-k-sync-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'phone: reconcile and migrate IE PL PT HR batch K'
          git push origin HEAD:phone/ie-pl-pt-hr-batch-k-current-facts-20260929
