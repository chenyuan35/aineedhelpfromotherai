name: DB-C4 materialize

on:
  push:
    branches:
      - codex/phone-db-c4a-20260929

permissions:
  contents: write

jobs:
  materialize:
    if: contains(github.event.head_commit.message, '[materialize-db-c4a]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and apply exact local patch
        shell: bash
        run: |
          set -euo pipefail
          echo '2b39343f52bfbba1fad6bf5f721c86994a6181f0a80b8fcd9714cab1096edc6a  .tmp/db-c4a.patch.gz.b64' | sha256sum -c -
          base64 -d .tmp/db-c4a.patch.gz.b64 > /tmp/db-c4a.patch.gz
          echo 'b9ced112dd8c9322eea8218b12922b1f8f0914855209e3a0b029125285e009c7  /tmp/db-c4a.patch.gz' | sha256sum -c -
          gzip -dc /tmp/db-c4a.patch.gz > /tmp/db-c4a.patch
          git apply --check /tmp/db-c4a.patch
          git apply /tmp/db-c4a.patch
          rm -f .tmp/db-c4a.patch.gz.b64 .github/workflows/db-c4a-materialize.yml
          rmdir .tmp 2>/dev/null || true
          git diff --check
          count=$(git status --short | wc -l | tr -d ' ')
          test "$count" = "23"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Phone: process DB-C4 sample routes'
          git push origin "HEAD:${GITHUB_REF_NAME}"
