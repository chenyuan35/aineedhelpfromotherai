name: DB-C4C closeout

on:
  push:
    branches:
      - codex/phone-db-c4c-closeout-20260929

permissions:
  contents: write

jobs:
  closeout:
    if: contains(github.event.head_commit.message, '[closeout-db-c4c]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile DB-C4C facts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          q = Path('docs/CURRENT_EXECUTION_QUEUE.md')
          s = q.read_text()
          anchor = 'Canonical result after DB-C4C: **98 routes / 54 markets / 95 brands / 74 networks / 323 sources**. Comparison remains **135**, comparison↔canonical overlap is **87**, **48 comparison routes remain legacy-only**, and explicit indexability remains **3**. Full Phone checks preserve the 135-route comparison surface and 3-route publication boundary.\n'
          release = '\nRelease: PR #311 (`a9bcc8a4628ab77a69f956cddbebc33800bcd84c`) merged after Eval Gate #961, CI #185 and Vercel Preview passed; production succeeded. Live checks confirmed the Phone hub and existing VOXI route at HTTP 200 and the non-indexable Orange Senegal route at HTTP 404.\n'
          if release.strip() not in s:
              assert anchor in s
              s = s.replace(anchor, anchor + release, 1)
          q.write_text(s)

          p = Path('docs/PHONE_DATABASE_COVERAGE_EXECUTION_2026-09-29.md')
          s = p.read_text()
          old = '''## Current verified state after DB-C4B

- comparison artifact: **135 routes**;
- canonical normalized database: **95 routes / 53 markets / 313 sources**;
- comparison↔canonical route-ID overlap: **84**;
- comparison routes still legacy-only: **51**;
- explicit route indexability: **3**.'''
          new = '''## Current verified state after DB-C4C

- comparison artifact: **135 routes**;
- canonical normalized database: **98 routes / 54 markets / 95 brands / 74 networks / 323 sources**;
- comparison↔canonical route-ID overlap: **87**;
- comparison routes still legacy-only: **48**;
- explicit route indexability: **3**.'''
          assert old in s
          s = s.replace(old, new, 1)
          anchor = 'Post-DB-C4C state: **98 canonical routes / 54 markets / 95 brands / 74 networks / 323 sources / 87 comparison-overlap route IDs / 48 comparison routes still legacy-only / 3 explicit indexable routes**. Full Phone checks preserve **135 comparison routes / 3 explicit indexable routes**.\n'
          release = '\nRelease: PR #311 (`a9bcc8a4628ab77a69f956cddbebc33800bcd84c`) merged after Eval Gate #961, CI #185 and Vercel Preview passed; production succeeded. Live checks confirmed the Phone hub and existing VOXI route at HTTP 200 and the non-indexable Orange Senegal route at HTTP 404.\n'
          if release.strip() not in s:
              assert anchor in s
              s = s.replace(anchor, anchor + release, 1)
          p.write_text(s)
          PY
          rm -f .github/workflows/db-c4c-closeout.yml
          git diff --check
          grep -q 'Current verified state after DB-C4C' docs/PHONE_DATABASE_COVERAGE_EXECUTION_2026-09-29.md
          grep -q 'PR #311' docs/CURRENT_EXECUTION_QUEUE.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Docs: close DB-C4C release facts'
          git push origin "HEAD:${GITHUB_REF_NAME}"
