name: DB-C8 docs close

on:
  push:
    branches:
      - docs/close-db-c8-20261001

permissions:
  contents: write

jobs:
  close-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update canonical fact sources
        run: |
          python3 scripts/tmp-close-db-c8-docs.py
          git diff --check
      - name: Commit fact-source closeout
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_CONTEXT.md docs/MASTER_PLAN.md docs/CURRENT_EXECUTION_QUEUE.md docs/PHONE_DATABASE_COVERAGE_EXECUTION_2026-09-29.md
          git commit -m 'docs: close DB-C8 and queue DB-C9'
          git push
