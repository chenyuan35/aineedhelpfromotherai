name: Phone DB-C21 Materialize

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/phone/review-packets/csl-711-prepaid-hk-2026.json'
      - 'data/phone/review-packets/fortress-hahasim-hk-2026.json'
      - 'data/phone/review-packets/tunetalk-365-my-2026.json'
      - 'scripts/test-phone-canonical-db-c21-migration.mjs'
      - 'package.json'
      - '.github/workflows/phone-db-c21-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install root dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate and apply DB-C21 review packets
        run: |
          set -euo pipefail
          for packet in \
            data/phone/review-packets/fortress-hahasim-hk-2026.json \
            data/phone/review-packets/csl-711-prepaid-hk-2026.json \
            data/phone/review-packets/tunetalk-365-my-2026.json; do
            node scripts/apply-phone-review-packet.mjs "$packet" --check
            node scripts/apply-phone-review-packet.mjs "$packet" --apply
          done
          node scripts/build-phone-database.mjs
      - name: Update historical regression totals
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [Path(f'scripts/test-phone-canonical-db-c{i}-migration.mjs') for i in range(15, 21)]
          for path in files:
              text = path.read_text()
              assert 'canonical.routes.length, 148' in text, path
              assert 'brands.length, 145' in text, path
              assert 'sources.length, 565' in text, path
              text = text.replace('canonical.routes.length, 148', 'canonical.routes.length, 151')
              text = text.replace('brands.length, 145', 'brands.length, 148')
              text = text.replace('sources.length, 565', 'sources.length, 574')
              path.write_text(text)
          PY
      - name: Verify materialized database and public boundary
        run: |
          npm run phone:data:check
          npm run verify
          npm run build --prefix frontend
          git diff --check
      - name: Commit materialized canonical and runtime artifacts
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo 'No materialization changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/phone/v1 \
            frontend/tools/phone-number-lifecycle-mvp/phone-database.json \
            frontend/tools/phone-number-lifecycle-mvp/phone-route-metrics.json \
            frontend/tools/phone-number-lifecycle-mvp/phone-route-summaries.json \
            frontend/tools/phone-number-lifecycle-mvp/phone-search-index.json \
            frontend/tools/phone-number-lifecycle-mvp/phone-route-data \
            scripts/test-phone-canonical-db-c15-migration.mjs \
            scripts/test-phone-canonical-db-c16-migration.mjs \
            scripts/test-phone-canonical-db-c17-migration.mjs \
            scripts/test-phone-canonical-db-c18-migration.mjs \
            scripts/test-phone-canonical-db-c19-migration.mjs \
            scripts/test-phone-canonical-db-c20-migration.mjs
          git commit -m 'data: materialize DB-C21 canonical artifacts'
          git push origin HEAD:${{ github.head_ref }}
