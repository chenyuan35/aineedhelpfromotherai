name: DB-C14 branch generator

on:
  push:
    branches:
      - data/db-c14-qa-cl-co-20261002
    paths:
      - .github/workflows/db-c14-generate.yml

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/db-c14-qa-cl-co-20261002
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply reviewed DB-C14 packets
        run: |
          set -euo pipefail
          for packet in \
            data/phone/review-packets/ooredoo-hala-qa-2026.json \
            data/phone/review-packets/claro-pre-cl-2026.json \
            data/phone/review-packets/claro-pre-co-2026.json; do
            node scripts/apply-phone-review-packet.mjs "$packet" --check
            node scripts/apply-phone-review-packet.mjs "$packet" --apply
          done
      - name: Wire DB-C14 regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/test-phone-canonical-db-c13-migration.mjs')
          s = p.read_text()
          old = "assert.equal(canonical.routes.length, 128); assert.equal(canonical.markets.length, 76); assert.equal(brands.length, 125); assert.equal(networks.length, 101); assert.equal(sources.length, 461);\n"
          if old in s:
              s = s.replace(old, '')
          s = s.replace(
              'Phone canonical DB-C13 migration passed: Telenor Sweden HOLD, Telia Denmark legacy HOLD, Telemach Slovenia ADMITTED; 128 canonical routes, 135 comparison routes and 3-route indexability preserved.',
              'Phone canonical DB-C13 migration passed: Telenor Sweden HOLD, Telia Denmark legacy HOLD, Telemach Slovenia ADMITTED; publication boundary preserved.'
          )
          p.write_text(s)
          q = Path('package.json')
          t = q.read_text()
          old2 = 'node scripts/test-phone-canonical-db-c13-migration.mjs && node scripts/test-phone-community-price-intake.mjs'
          new2 = 'node scripts/test-phone-canonical-db-c13-migration.mjs && node scripts/test-phone-canonical-db-c14-migration.mjs && node scripts/test-phone-community-price-intake.mjs'
          if new2 not in t:
              if old2 not in t:
                  raise SystemExit('phone:data:check anchor not found')
              t = t.replace(old2, new2)
          q.write_text(t)
          PY
      - name: Rebuild and verify
        run: |
          npm run phone:data:build
          npm run phone:data:check
          npm run verify
          npm run build --prefix frontend
          git diff --check
      - name: Commit generated DB-C14 state
        run: |
          rm .github/workflows/db-c14-generate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "data(phone): normalize DB-C14 Qatar Chile Colombia"
          git push origin HEAD:data/db-c14-qa-cl-co-20261002
