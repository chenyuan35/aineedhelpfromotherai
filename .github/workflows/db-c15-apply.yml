name: DB-C15 branch apply

on:
  push:
    branches:
      - data/db-c15-pe-uk-20261003
    paths:
      - .github/workflows/db-c15-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DB-C15 branch
        uses: actions/checkout@v4
        with:
          ref: data/db-c15-pe-uk-20261003
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply reviewed DB-C15 inputs
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/db-c15-input.patch.gz.b64 | gzip -d > /tmp/db-c15-input.patch
          git apply --check /tmp/db-c15-input.patch
          git apply /tmp/db-c15-input.patch
          for packet in \
            data/phone/review-packets/movistar-pre-pe-2026.json \
            data/phone/review-packets/talkmobile-uk-payg-closed-2026.json \
            data/phone/review-packets/smarty-uk-2026.json; do
            node scripts/apply-phone-review-packet.mjs "$packet" --check
            node scripts/apply-phone-review-packet.mjs "$packet" --apply
          done
          node scripts/build-phone-database.mjs

      - name: Verify DB-C15
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run phone:data:check
          npm run verify
          npm run build --prefix frontend
          git diff --check

      - name: Publish generated DB-C15 branch state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/db-c15-input.patch.gz.b64 .github/workflows/db-c15-apply.yml
          git add -A
          git commit -m 'data(phone): normalize DB-C15 Peru and UK routes'
          git push origin HEAD:data/db-c15-pe-uk-20261003
