name: DB-C4D closeout bootstrap

on:
  push:
    branches:
      - docs/db-c4d-closeout-20260929
    paths:
      - '.bootstrap/db-c4d-closeout.patch.gz.b64'
      - '.github/workflows/db-c4d-closeout-bootstrap.yml'

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply DB-C4D release closeout
        shell: bash
        run: |
          base64 -d .bootstrap/db-c4d-closeout.patch.gz.b64 | gzip -d > /tmp/db-c4d-closeout.patch
          git apply --check /tmp/db-c4d-closeout.patch
          git apply --index /tmp/db-c4d-closeout.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Docs: close DB-C4D release facts"
          git push origin "HEAD:${GITHUB_REF_NAME}"
