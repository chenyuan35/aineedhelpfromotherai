name: Bootstrap Red Pocket eBay route

on:
  push:
    branches:
      - phone/redpocket-ebay-20261005

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild and apply verified patch
        shell: bash
        run: |
          cat _bootstrap/rpchunk-* | base64 -d | gunzip > /tmp/redpocket.patch
          git apply --check /tmp/redpocket.patch
          git apply /tmp/redpocket.patch
      - name: Validate canonical data
        shell: bash
        run: |
          npm ci --ignore-scripts
          npm run phone:data:check
          npm ci --prefix frontend
          npm run build --prefix frontend
          node scripts/test-phone-number-public-release.mjs
          git diff --check
      - name: Commit final branch state
        shell: bash
        run: |
          rm -rf _bootstrap .github/workflows/bootstrap-redpocket.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "data(phone): split Red Pocket eBay annual route"
          git push origin HEAD:phone/redpocket-ebay-20261005
