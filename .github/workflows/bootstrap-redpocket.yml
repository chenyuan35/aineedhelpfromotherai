name: Bootstrap Red Pocket eBay route

on:
  push:
    branches:
      - phone/redpocket-ebay-20261005

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify and apply reviewed patch
        shell: bash
        run: |
          echo '56ffc0a5edb5922e27a778bbdedeba0c2563018017d689f39735ff9eddcecf26  _bootstrap/redpocket.patch.xz.b64' | sha256sum -c -
          base64 -d _bootstrap/redpocket.patch.xz.b64 > /tmp/redpocket.patch.xz
          echo 'ad1468169bfa196873d27135dda6846189e6df08614d7a3df63b71613c6b8cc2  /tmp/redpocket.patch.xz' | sha256sum -c -
          xz -dc /tmp/redpocket.patch.xz > /tmp/redpocket.patch
          echo 'a949913d52f6d04717805bc29990999ac388a03e8c923e800a29b83a33b417f0  /tmp/redpocket.patch' | sha256sum -c -
          git apply --check /tmp/redpocket.patch
          git apply /tmp/redpocket.patch
      - name: Validate canonical data
        shell: bash
        run: |
          npm ci --ignore-scripts
          npm run phone:data:check
          npm ci --prefix frontend
          npm run build --prefix frontend
          node scripts/test-phone-number-public-release.mjs
          git diff --check
      - name: Commit final branch state
        shell: bash
        run: |
          rm -rf _bootstrap .github/workflows/bootstrap-redpocket.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "data(phone): split Red Pocket eBay annual route"
          git push origin HEAD:phone/redpocket-ebay-20261005
